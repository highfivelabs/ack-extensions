# Rendered by highfivelabs/krm-ci ci/krm/sync.py; do not edit here.
# Weekly, grouped, and a week's cooldown before taking a new release, so a
# compromised release is likely caught upstream before it reaches us (Azure
# Service Operator's settings). Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    # The krm-ci pin moves only through krm-ci's sync.py, which moves
    # `uses:` and `ci-ref:` together; Dependabot would move `uses:` alone.
    ignore:
      - dependency-name: "highfivelabs/krm-ci*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
