# Branch protection requires the `ci` status.
name: hfl-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: hfl-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  krm:
    uses: highfivelabs/krm-ci/.github/workflows/krm-ci.yml@43eb967d93c5565abc05b2d6927073ccf3315b98 # v1.1.0
    permissions:
      contents: read
    with:
      ci-ref: 43eb967d93c5565abc05b2d6927073ccf3315b98
      setup-command: ""
      check-command: "hack/ci/pr.sh check"
      e2e-command: "hack/ci/pr.sh e2e"
      free-disk: true
      timeout-minutes: 180
      sibling-repo: ""
      sibling-ref: ""
