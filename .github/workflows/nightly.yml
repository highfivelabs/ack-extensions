#
# The whole suite on main, once a day (decided 2026-11-10): task check
# and task operator-e2e, as two jobs on GitHub's free runners (the
# repository is public; HFL-818). A failure opens one issue labelled
# ci-nightly, or comments on it if it is open already (a green night runs
# no reporting job; close the issue by hand).
name: nightly

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The runner's unused SDKs (about 30 GB), for the module graph.
      - working-directory: /
        run: |
          trash="$(sudo mktemp -d /.free-disk.XXXXXX)"
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            [ -e "$d" ] && sudo mv "$d" "$trash/$(echo "$d" | tr / _)"
          done
          sudo setsid nohup rm -rf "$trash" >/dev/null 2>&1 < /dev/null &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - run: task tools
      - run: task check

  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - working-directory: /
        run: |
          trash="$(sudo mktemp -d /.free-disk.XXXXXX)"
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            [ -e "$d" ] && sudo mv "$d" "$trash/$(echo "$d" | tr / _)"
          done
          sudo setsid nohup rm -rf "$trash" >/dev/null 2>&1 < /dev/null &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - run: task tools
      - run: task operator-e2e

  report:
    needs: [check, e2e]
    if: always() && github.ref == 'refs/heads/main' && (needs.check.result != 'success' || needs.e2e.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: hack/ci/nightly-report.sh
