#
# On a v* tag: build the operator and every manager image with ko, the way
# tests/operator/run.sh builds them (config/default's ko:// references),
# push them to the High Five Labs OCI registry tagged with the git tag, and
# keep the resolved install manifest as the run's `install` artifact.
#
# The registry is written through Workload Identity Federation as
# vars.RELEASE_SERVICE_ACCOUNT (only artifactregistry.writer on hfl-oci in vars.GCP_PROJECT; it cannot create VMs); no key is stored here. It runs only when
# the repository variable RELEASE_ENABLED is "true", which is set once the
# WIF provider admits this repository (the PR that added this file says
# what to change).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: us-central1-docker.pkg.dev
      KO_DOCKER_REPO: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hfl-oci/ack-extensions
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/factory-access
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/tools
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Build and push the images
        env:
          REGISTRY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: task release TAG="${TAG}" REGISTRY="${REGISTRY}" KO_DOCKER_REPO="${KO_DOCKER_REPO}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install
          path: out/
