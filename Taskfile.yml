#
# ack-extensions: kinds AWS Controllers for Kubernetes (ACK) does not have
# yet, built on ACK's runtime and generator. Tests run against moto, a
# fake AWS; nothing here talks to real AWS.
#
# `task` lists the tasks. Install it with `brew install go-task` or
# `go install github.com/go-task/task/v3/cmd/task@latest`.
version: '3'

# Environment identifiers (the sandbox account, ...) come from a
# git-ignored .env; .env.example lists them.
dotenv: ['.env']

set: [errexit, pipefail]

includes:
  # The tasks the extension repositories share (go:install-tool,
  # go:fmt-check, go:committed, go:test-envtest), from factory at a tag,
  # pinned by checksum (factory taskfiles/README.md). Task fetches it with
  # your git credentials and caches it in .task/remote/ (.taskrc.yml);
  # offload packs that cache for its VMs.
  go:
    taskfile: https://github.com/highfivelabs/factory.git//taskfiles/go.yml?ref=taskfiles/v1.0.0
    checksum: 4e300f59230b59ea875e8409e786064dd76cc3c28d5de37ec46bb856d7366f32
    vars:
      BIN: '{{.ROOT_DIR}}/bin'

env:
  GOTOOLCHAIN: '{{.GOTOOLCHAIN | default "local"}}'
  # Every task's end-to-end tests run against the fake; only
  # hack/live/run.sh (task test-live) sets "real" for its own go test.
  CLOUDCONTROL_E2E_TARGET: fake

vars:
  # The project's name, for a rename: the Go module path, the images and
  # pkg/operator.Name carry it too.
  PROJECT: ack-extensions
  BIN: '{{.ROOT_DIR}}/bin'
  # Every directory under services/ is a service.
  SERVICES:
    sh: ls services | xargs
  ENVTEST_K8S_VERSION: 1.35.x
  # Pinned tool versions (2026-11-07). controller-gen is the version ACK's
  # code generator requires (scripts/lib/common.sh).
  CONTROLLER_GEN: sigs.k8s.io/controller-tools/cmd/controller-gen@v0.19.0
  GOIMPORTS: golang.org/x/tools/cmd/goimports@v0.38.0
  SETUP_ENVTEST: sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260305142021-f9589b9f2b9d
  GO_LICENSES: github.com/google/go-licenses@v1.6.0

tasks:
  default:
    desc: Everything that must hold before a commit (check).
    cmds:
      - task: check

  controller-gen:
    internal: true
    cmds:
      - task: go:install-tool
        vars: {NAME: controller-gen, PKG: '{{.CONTROLLER_GEN}}'}
  goimports:
    internal: true
    cmds:
      - task: go:install-tool
        vars: {NAME: goimports, PKG: '{{.GOIMPORTS}}'}
  setup-envtest:
    internal: true
    cmds:
      - task: go:install-tool
        vars: {NAME: setup-envtest, PKG: '{{.SETUP_ENVTEST}}'}
  go-licenses:
    internal: true
    cmds:
      - task: go:install-tool
        vars: {NAME: go-licenses, PKG: '{{.GO_LICENSES}}'}

  tools:
    desc: ACK's generator at the pin plus patches/, the other tools, and the fake AWS (moto).
    cmds:
      - task: upstream
      - task: controller-gen
      - task: goimports
      - task: setup-envtest
      - task: go-licenses
      - hack/moto.sh

  upstream:
    desc: Fetch ACK's code generator at the pin, apply patches/code-generator/, build it.
    cmds:
      - hack/upstream.sh

  upstream-check:
    desc: Fail if third_party/code-generator is not the pin plus patches/.
    cmds:
      - hack/upstream.sh --check

  "upstream:yaml-check":
    desc: Fail if upstream.yaml (UPSTREAM.md, machine-readable) and UPSTREAM.md disagree; needs no upstream checkout.
    dir: hack/upstream-yaml
    cmds:
      - go run . ../..

  generate:
    desc: Regenerate the CRDs, API types, controllers and roles; and ACKContext's CRD and deepcopy (controller-gen, apis/core).
    cmds:
      - task: upstream-check
      - task: controller-gen
      - task: goimports
      - hack/generate.sh
      - '"{{.BIN}}/controller-gen" object:headerFile=cloudcontrol/hack/boilerplate.go.txt paths=./apis/...'
      - '"{{.BIN}}/controller-gen" crd paths=./apis/... output:crd:artifacts:config=config/context'

  build:
    desc: Build every service's manager and the operator into bin/.
    cmds:
      - mkdir -p "{{.BIN}}"
      - for: {var: SERVICES, split: ' '}
        cmd: go build -o "{{.BIN}}/{{.ITEM}}-manager" ./services/{{.ITEM}}/cmd/controller
      - go build -o "{{.BIN}}/operator" ./cmd/operator
      - go build -o "{{.BIN}}/cloudcontrol-manager" ./cloudcontrol/cmd/manager

  test:
    desc: Unit tests, the operator against envtest, and every kind end to end (envtest's kube-apiserver, the service's real controller binary, moto).
    cmds:
      - task: setup-envtest
      - hack/moto.sh
      - task: go:test-envtest
        vars: {ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION}}'}

  check:
    desc: Generated files current, gofmt, vet, SPDX lines, build, tests.
    cmds:
      - task: check:static
      - task: build
      - task: test

  # check without build and the tests: what every pull request runs, whatever
  # it changed (hack/ci/select.sh; a kind's own tests follow).
  "check:static":
    desc: check's pin, generated-files, gofmt, vet and SPDX checks, without the build and the tests.
    cmds:
      - task: upstream-check
      - task: upstream:yaml-check
      - task: go:fmt-check
        vars: {DIRS: services apis pkg cmd tests cloudcontrol hack/cloudcontrol-gen hack/noaws hack/ack-iam}
      - task: noaws
      - task: generate
      - task: go:committed
        vars: {PATHS: services apis config, WHAT: generated files}
      - task: cloudcontrol:generated
      # ACK's generated code fails vet's composites check (unkeyed fields in
      # metav1.Time and acktypes.VersionInfo literals), as ACK's own
      # controllers do; every other analyzer runs.
      - go vet -composites=false ./...
      # The live-only code (docs/live-runs.md) compiled, never run.
      - go vet -tags live ./cloudcontrol/test/live/... ./hack/live/... ./cloudcontrol/test/e2e/
      - hack/check-spdx.sh

  # Some packages' tests, as test runs them: what CI runs for a pull request
  # that changes only some services (hack/ci/select.sh).
  "test:pkgs":
    desc: 'The tests of some packages (envtest, moto): task test:pkgs PKGS="./services/iam/..." [RUN=regexp] [TIMEOUT=30m].'
    requires:
      vars: [PKGS]
    cmds:
      - task: setup-envtest
      - hack/moto.sh
      - task: go:test-envtest
        vars:
          ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION}}'
          PKGS: '{{.PKGS}}{{if .RUN}} -run ''{{.RUN}}''{{end}}'
          TIMEOUT: '{{.TIMEOUT | default "30m"}}'

  noaws:
    desc: 'Fail if any test path could reach a real AWS endpoint: SDK clients, processes, HTTP clients and scripts in test paths all go through pkg/fakeaws (hack/noaws/main.go lists the rules).'
    cmds:
      - go run ./hack/noaws .

  cloudcontrol:generate:
    desc: Regenerate the Cloud Control kinds (CRDs, embedded schemas, registry, IAM policies, RBAC, report) from cloudcontrol/types.yaml and the schema zip; CloudControlContext's CRD and deepcopy (controller-gen); and the readiness survey of every type.
    cmds:
      - task: controller-gen
      - '"{{.BIN}}/controller-gen" object:headerFile=cloudcontrol/hack/boilerplate.go.txt paths=./cloudcontrol/apis/...'
      - '"{{.BIN}}/controller-gen" crd paths=./cloudcontrol/apis/... output:crd:artifacts:config=cloudcontrol/config/context'
      - go run ./hack/cloudcontrol-gen
      - go run ./hack/cloudcontrol-gen --survey

  cloudcontrol:iam:
    desc: 'One environment''s IAM role for Cloud Control: permission policies (the kinds its CloudControlContext enables) and the EKS Pod Identity trust policy. task cloudcontrol:iam NAMESPACE=team-a-prod ACCOUNT=111122223333 CLUSTER_ARN=arn:aws:eks:...:cluster/x [KINDS=SAMLProvider.iam,Detector.guardduty] OUT=dir'
    requires:
      vars: [NAMESPACE, ACCOUNT, CLUSTER_ARN, OUT]
    cmds:
      - go run ./hack/cloudcontrol-gen --iam --namespace "{{.NAMESPACE}}" --account "{{.ACCOUNT}}" --cluster-arn "{{.CLUSTER_ARN}}" --kinds "{{.KINDS}}" --out "{{.OUT}}"

  ack:iam:
    desc: 'One environment''s IAM role for its ACK-generated managers: permission policies (the kinds its ACKContext enables, read from the generated code plus pkg/ackiam''s curated extras) and the EKS Pod Identity trust policy for its managers. task ack:iam CONTEXT=ackcontext.yaml ACCOUNT=111122223333 CLUSTER_ARN=arn:aws:eks:...:cluster/x OUT=dir; task ack:iam LIST=1 prints every kind''s actions'
    cmds:
      - |
        if [ -n "{{.LIST}}" ]; then go run ./hack/ack-iam --list; exit 0; fi
        go run ./hack/ack-iam --context "{{.CONTEXT}}" --account "{{.ACCOUNT}}" --cluster-arn "{{.CLUSTER_ARN}}" --out "{{.OUT}}"

  cloudcontrol:generated:
    desc: Fail if the committed Cloud Control outputs differ from a regeneration.
    cmds:
      - task: cloudcontrol:generate
      - task: go:committed
        vars: {PATHS: cloudcontrol, WHAT: generated Cloud Control files}

  cloudcontrol:test:
    desc: The Cloud Control unit tests and end-to-end tests (envtest, the manager's real binary in namespaced mode as its namespace's restricted identity, the fake Cloud Control over moto).
    cmds:
      - task: setup-envtest
      - hack/moto.sh
      - task: go:test-envtest
        vars: {ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION}}', PKGS: ./cloudcontrol/... ./hack/cloudcontrol-gen/..., TIMEOUT: 20m}

  cloudcontrol:check:
    desc: Everything the Cloud Control route needs before a commit (generated files current, vet, build, tests); task check runs it all too.
    cmds:
      - task: go:fmt-check
        vars: {DIRS: cloudcontrol hack/cloudcontrol-gen}
      - task: noaws
      - task: cloudcontrol:generated
      - go vet ./cloudcontrol/... ./hack/cloudcontrol-gen/...
      - hack/check-spdx.sh
      - go build -o "{{.BIN}}/cloudcontrol-manager" ./cloudcontrol/cmd/manager
      - task: cloudcontrol:test

  # Live tests against the real sandbox account (docs/live-runs.md). Never
  # run by check or any task it runs (hack/noaws checks that); refuse to
  # start without ACK_EXT_LIVE=create-real-aws-resources and ACCOUNT equal
  # to AWS_SANDBOX_ACCOUNT_ID (.env.example). Run on an offload VM with --sa (federated
  # credentials, hack/live/credentials.sh).
  test-live:
    desc: 'The Cloud Control e2e tests against the fake, then the real sandbox account: ACK_EXT_LIVE=create-real-aws-resources task test-live ACCOUNT=<id> ROLE_ARN=<arn> [TESTS="TestDetector"] (docs/live-runs.md).'
    requires:
      vars: [ACCOUNT, ROLE_ARN]
    cmds:
      - task: setup-envtest
      - hack/moto.sh
      - |
        export KUBEBUILDER_ASSETS="$("{{.BIN}}/setup-envtest" use {{.ENVTEST_K8S_VERSION}} --bin-dir "{{.BIN}}/envtest" -p path)"
        hack/live/run.sh --account "{{.ACCOUNT}}" --role-arn "{{.ROLE_ARN}}" {{.TESTS}}

  live-sweep:
    desc: 'Delete live-test leftovers of runs older than 2h, or everything of RUN=<id> (docs/live-runs.md).'
    cmds:
      - go run -tags live ./hack/live/sweep{{if .RUN}} --run "{{.RUN}}"{{end}}

  live-list:
    desc: 'List every live-test resource in the sandbox account (docs/live-runs.md).'
    cmds:
      - go run -tags live ./hack/live/sweep --list

  # The merge gate while GitHub Actions is off (docs/testing.md, "The
  # merge gate"): ci.yml's pull-request jobs on an offload Spot VM, then
  # the commit status offload/ci on the commit.
  ci:
    desc: 'ci.yml''s pull-request jobs (plan, check, operator-e2e) for one commit on an offload Spot VM, then the offload/ci status on it: task ci [SHA=HEAD] [CI_BASE=origin/main].'
    env:
      CI_BASE: '{{.CI_BASE}}'
    cmds:
      - hack/ci/gate.sh {{.SHA | default "HEAD"}}

  hooks:
    desc: Install the pre-push hook (hack/hooks/pre-push, which runs task ci) with core.hooksPath.
    cmds:
      - git config core.hooksPath hack/hooks

  licenses:
    desc: Write docs/third-party-licenses.csv; fail on a licence outside the accepted set.
    cmds:
      - task: go-licenses
      - hack/licenses.sh

  operator-e2e:
    desc: The operator on kind beside ACK's real rds-controller (tests/operator/run.sh).
    cmds:
      # A script that is empty or truncated runs and exits 0, so the task
      # also checks the script is whole and that its output ends with its
      # last line. The output is captured to a file and read after, not
      # piped to grep -q, which can fail a long log under pipefail.
      - |
        script=tests/operator/run.sh
        [ -s "$script" ] || { echo "FAIL: $script is missing or empty"; exit 1; }
        lines="$(wc -l < "$script")"
        [ "$lines" -gt 200 ] || { echo "FAIL: $script has $lines lines (more than 200 expected): truncated?"; exit 1; }
        out="$(mktemp)"
        "$script" 2>&1 | tee "$out"
        last="$(grep -v '^[[:space:]]*$' "$out" | tail -n 1 || true)"
        rm -f "$out"
        case "$last" in
          "all checks passed"*) ;;
          *) echo "FAIL: $script did not end with 'all checks passed' (last line: '$last')"; exit 1 ;;
        esac

  coverage:
    desc: Regenerate docs/coverage/ and the README's Coverage section (hack/coverage/, docs/coverage/README.md).
    cmds:
      - hack/coverage/run.sh

  coverage:check:
    desc: Fail if the committed coverage outputs differ from a regeneration from the pinned inputs.
    cmds:
      - hack/coverage/run.sh --check
