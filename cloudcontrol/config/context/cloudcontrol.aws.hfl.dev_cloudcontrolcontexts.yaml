---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: cloudcontrolcontexts.cloudcontrol.aws.hfl.dev
spec:
  group: cloudcontrol.aws.hfl.dev
  names:
    categories:
    - aws
    - cloudcontrol
    kind: CloudControlContext
    listKind: CloudControlContextList
    plural: cloudcontrolcontexts
    singular: cloudcontrolcontext
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.roleARN
      name: Role
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudControlContext enables Cloud Control in its namespace: the operator
          runs a manager there, watching only that namespace, as that namespace's
          own ServiceAccount, bound by EKS Pod Identity to the environment's IAM
          role, serving the Cloud Control kinds the context enables. It is
          Config Connector's ConfigConnectorContext (namespaced mode) for AWS. One
          per namespace, named cloudcontrol.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudControlContextSpec is how an environment (a namespace) runs Cloud
              Control: as which AWS role, in which region, and for which kinds.
            properties:
              deletionPolicy:
                description: |-
                  DeletionPolicy is what deleting an object does to its AWS resource
                  when the object does not say (ACK's services.k8s.aws/deletion-policy
                  annotation): delete (the default) or retain.
                enum:
                - delete
                - retain
                type: string
              kinds:
                description: |-
                  Kinds are the Cloud Control kinds the namespace's manager serves, as
                  Kind.service (SAMLProvider.iam, Detector.guardduty). Empty: every
                  kind the manager serves. An object of a kind not listed is left
                  alone, and the role need not carry its permissions.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              region:
                description: Region is the AWS region the environment's resources
                  are made in.
                pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]$
                type: string
              roleARN:
                description: |-
                  RoleARN is the environment's IAM role. The operator runs the
                  namespace's manager as the ServiceAccount ack-extensions-cloudcontrol,
                  and an EKS Pod Identity association, made outside the cluster (the
                  operator holds no AWS credentials), binds that ServiceAccount to this
                  role. status.podIdentityAssociation says exactly which association.
                  The role's permissions are the generated policies of the kinds this
                  context enables (task cloudcontrol:iam).
                pattern: ^arn:aws[a-z-]*:iam::[0-9]{12}:role/[\w+=,.@/-]+$
                type: string
            required:
            - region
            - roleARN
            type: object
          status:
            description: CloudControlContextStatus is what the operator made of the
              context.
            properties:
              conditions:
                description: 'Conditions: Ready is true when the manager is rolled
                  out.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              kinds:
                description: Kinds are the kinds served, as Kind.service.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation last acted on.
                format: int64
                type: integer
              podIdentityAssociation:
                description: PodIdentityAssociation is the association the environment
                  needs.
                properties:
                  namespace:
                    type: string
                  roleARN:
                    type: string
                  serviceAccount:
                    type: string
                required:
                - namespace
                - roleARN
                - serviceAccount
                type: object
              serviceAccount:
                description: ServiceAccount the namespace's manager runs as.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a CloudControlContext must be named cloudcontrol: one per namespace'
          rule: self.metadata.name == 'cloudcontrol'
    served: true
    storage: true
    subresources:
      status: {}
