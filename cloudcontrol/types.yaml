#
# The CloudFormation types served as Kubernetes kinds through AWS Cloud
# Control API (docs/cloudcontrol.md). This list is the only per-type input:
# hack/cloudcontrol-gen reads each type's registry schema from the pinned
# zip (docs/coverage/inputs/CloudformationSchema.zip) and generates the CRD,
# the embedded schema, the registry entry, the IAM policy and the RBAC.
#
# The group is <service, lower case>.<groupSuffix>; the kind is the
# resource's name. A type ACK serves, or that ACK's generator could build
# here with better behaviour, does not belong in this list
# (docs/cloudcontrol.md, "Which route").
#
# Per type:
#   typeName  the CloudFormation type (required);
#   kind      the kind's name, when the resource's name will not do;
#   secrets   write-only string properties that are secrets, as property
#             pointers: each becomes a Kubernetes Secret reference. Opt-in
#             per field (the builder, 2026-11-09); every other write-only
#             property is a plain field. The generation report lists the
#             candidates;
#   unproven  why the kind has no end-to-end test on the fake (moto lacks
#             the service's API); the coverage data reports it. Every other
#             type has a moto backend (cloudcontrol/test/fake) and a test
#             (cloudcontrol/test/e2e);
#   neverDelete  true for a resource whose delete cannot be undone: deleting
#             the object keeps the resource in AWS, whatever the object's
#             annotations say. The reconciler never calls DeleteResource
#             for the type, its IAM policy has no delete permissions, and
#             its CRD carries cloudcontrol.aws.hfl.dev/never-delete. Default
#             false; no type served sets it yet (docs/cloudcontrol.md,
#             section 3).
groupSuffix: cloudcontrol.aws.hfl.dev
version: v1alpha1
# What the end-to-end tests do themselves on a live run, beside the kinds'
# own handler permissions: fixtures they make and the checks they read.
# Goes into the sandbox account's template (config/live, docs/live-runs.md).
liveTestActions:
  - ec2:CreateTransitGateway
  - ec2:DeleteTransitGateway
  - ec2:DescribeTransitGateways
  - ec2:CreateTags
  - sso:ListInstances
  - ec2:CreateVpc
  - ec2:DeleteVpc
  - ec2:CreateSubnet
  - ec2:DeleteSubnet
  - ec2:CreateTransitGatewayVpcAttachment
  - ec2:DeleteTransitGatewayVpcAttachment
  - ec2:DescribeTransitGatewayVpcAttachments
  - ec2:CreateTransitGatewayRouteTable
  - ec2:DeleteTransitGatewayRouteTable
  - ec2:SearchTransitGatewayRoutes
  - ec2:GetTransitGatewayRouteTableAssociations
  - ec2:GetTransitGatewayRouteTablePropagations
  - ec2:DescribeTransitGatewayPeeringAttachments
types:
  # F03: IAM SAML providers. ACK's iam-controller ignores SAMLProvider.
  - typeName: AWS::IAM::SAMLProvider
    # The private key is a secret; RemovePrivateKey, also write-only, is
    # the ID of a key to remove and stays a plain field.
    secrets: [/properties/AddPrivateKey]
  # F04: Transit Gateway route tables. ACK's ec2-controller ignores them.
  - typeName: AWS::EC2::TransitGatewayRouteTable
  # F15: GuardDuty's detector. ACK has no GuardDuty controller.
  - typeName: AWS::GuardDuty::Detector
  # F02: IAM Identity Center. ACK has no controller (ssoadmin-controller is
  # an empty repository). An Instance is not a kind: an organization has
  # one, made by enabling Identity Center; its ARN is a field.
  - typeName: AWS::SSO::PermissionSet
  - typeName: AWS::SSO::Assignment
  - typeName: AWS::SSO::InstanceAccessControlAttributeConfiguration
    unproven: "moto 5.2.5 has no Create/Describe/Update/DeleteInstanceAccessControlAttributeConfiguration"
  # F04: Transit Gateway routing beside the route table. ACK's
  # ec2-controller v1.23.1 has TransitGateway and TransitGatewayVPCAttachment
  # and none of these. Association and propagation link an attachment to a
  # route table; a route is a static route in one; a peering attachment is
  # the requester's side (the peer accepts it outside this kind).
  - typeName: AWS::EC2::TransitGatewayRoute
  - typeName: AWS::EC2::TransitGatewayRouteTableAssociation
  - typeName: AWS::EC2::TransitGatewayRouteTablePropagation
  - typeName: AWS::EC2::TransitGatewayPeeringAttachment
  # F07: Control Tower's enabled controls and baselines on an OU. ACK has no
  # Control Tower controller, issue or pull request. LandingZone waits for
  # the builder (plan section 9, question 15): deleting one decommissions
  # the landing zone.
  - typeName: AWS::ControlTower::EnabledControl
    unproven: "moto 5.2.5 has no controltower, and no other emulator exists"
  - typeName: AWS::ControlTower::EnabledBaseline
    unproven: "moto 5.2.5 has no controltower, and no other emulator exists"
  # F16: Security Hub. ACK has no Security Hub controller, issue or pull
  # request. moto 5.2.5 has the hub (enable, describe, disable) and the
  # organization configuration; it has enabling a delegated administrator
  # but not listing or disabling one, and none of standards, aggregators,
  # configuration policies, automation rules or action targets.
  - typeName: AWS::SecurityHub::Hub
  - typeName: AWS::SecurityHub::OrganizationConfiguration
  - typeName: AWS::SecurityHub::DelegatedAdmin
    unproven: "moto 5.2.5 has EnableOrganizationAdminAccount but no ListOrganizationAdminAccounts or DisableOrganizationAdminAccount"
  - typeName: AWS::SecurityHub::Standard
    unproven: "moto 5.2.5 has no BatchEnableStandards, GetEnabledStandards or BatchDisableStandards"
  - typeName: AWS::SecurityHub::FindingAggregator
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteFindingAggregator"
  - typeName: AWS::SecurityHub::ConfigurationPolicy
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteConfigurationPolicy"
  - typeName: AWS::SecurityHub::PolicyAssociation
    unproven: "moto 5.2.5 has no StartConfigurationPolicyAssociation or GetConfigurationPolicyAssociation"
  - typeName: AWS::SecurityHub::AutomationRule
    unproven: "moto 5.2.5 has no CreateAutomationRule or BatchGet/Update/DeleteAutomationRules"
  - typeName: AWS::SecurityHub::ActionTarget
    unproven: "moto 5.2.5 has no Create/Describe/Update/DeleteActionTarget(s)"
