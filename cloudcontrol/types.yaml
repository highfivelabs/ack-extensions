#
# The CloudFormation types served as Kubernetes kinds through AWS Cloud
# Control API (docs/cloudcontrol.md). This list is the only per-type input:
# hack/cloudcontrol-gen reads each type's registry schema from the pinned
# zip (docs/coverage/inputs/CloudformationSchema.zip) and generates the CRD,
# the embedded schema, the registry entry, the IAM policy and the RBAC.
#
# The group is <service, lower case>.<groupSuffix>; the kind is the
# resource's name. A type ACK serves, or that ACK's generator could build
# here with better behaviour, does not belong in this list
# (docs/cloudcontrol.md, "Which route").
#
# Per type:
#   typeName  the CloudFormation type (required);
#   kind      the kind's name, when the resource's name will not do;
#   secrets   write-only string properties that are secrets, as property
#             pointers: each becomes a Kubernetes Secret reference. Opt-in
#             per field (the builder, 2026-11-09); every other write-only
#             property is a plain field. The generation report lists the
#             candidates;
#   unproven  why the kind has no end-to-end test on the fake (moto lacks
#             the service's API); the coverage data reports it. Every other
#             type has a moto backend (cloudcontrol/test/fake) and a test
#             (cloudcontrol/test/e2e);
#   neverDelete  true for a resource whose delete cannot be undone: deleting
#             the object keeps the resource in AWS, whatever the object's
#             annotations say. The reconciler never calls DeleteResource
#             for the type, its IAM policy has no delete permissions, and
#             its CRD carries cloudcontrol.aws.hfl.dev/never-delete. Default
#             false (docs/cloudcontrol.md, section 3). Such a type also
#             joins config/admission/retain-only.yaml, is left out of the
#             live-test role and is never swept.
groupSuffix: cloudcontrol.aws.hfl.dev
version: v1alpha1
# What the end-to-end tests do themselves on a live run, beside the kinds'
# own handler permissions: fixtures they make and the checks they read.
# Goes into the sandbox account's template (config/live, docs/live-runs.md).
liveTestActions:
  - ec2:CreateTransitGateway
  - ec2:DeleteTransitGateway
  - ec2:DescribeTransitGateways
  - ec2:CreateTags
  - sso:ListInstances
  - ec2:CreateVpc
  - ec2:DeleteVpc
  - ec2:CreateSubnet
  - ec2:DeleteSubnet
  - ec2:CreateTransitGatewayVpcAttachment
  - ec2:DeleteTransitGatewayVpcAttachment
  - ec2:DescribeTransitGatewayVpcAttachments
  - ec2:CreateTransitGatewayRouteTable
  - ec2:DeleteTransitGatewayRouteTable
  - ec2:SearchTransitGatewayRoutes
  - ec2:GetTransitGatewayRouteTableAssociations
  - ec2:GetTransitGatewayRouteTablePropagations
  - ec2:DescribeTransitGatewayPeeringAttachments
  - route53:CreateHostedZone
  - route53:DeleteHostedZone
  - route53:GetQueryLoggingConfig
  - logs:CreateLogGroup
  - logs:DeleteLogGroup
  - logs:DescribeLogGroups
  - ec2:DescribeVpcs
  - route53resolver:ListResolverDnssecConfigs
  - iam:CreateRole
  - iam:DeleteRole
  - s3:CreateBucket
  - s3:DeleteBucket
  - config:DescribeConfigurationRecorderStatus
  - secretsmanager:CreateSecret
  - secretsmanager:DeleteSecret
types:
  # F03: IAM SAML providers. ACK's iam-controller ignores SAMLProvider.
  - typeName: AWS::IAM::SAMLProvider
    # The private key is a secret; RemovePrivateKey, also write-only, is
    # the ID of a key to remove and stays a plain field.
    secrets: [/properties/AddPrivateKey]
  # F04: Transit Gateway route tables. ACK's ec2-controller ignores them.
  - typeName: AWS::EC2::TransitGatewayRouteTable
  # F15: GuardDuty's detector. ACK has no GuardDuty controller.
  - typeName: AWS::GuardDuty::Detector
  # F02: IAM Identity Center. ACK has no controller (ssoadmin-controller is
  # an empty repository). An Instance is not a kind: an organization has
  # one, made by enabling Identity Center; its ARN is a field.
  - typeName: AWS::SSO::PermissionSet
  - typeName: AWS::SSO::Assignment
  - typeName: AWS::SSO::InstanceAccessControlAttributeConfiguration
    unproven: "moto 5.2.5 has no Create/Describe/Update/DeleteInstanceAccessControlAttributeConfiguration"
  # F04: Transit Gateway routing beside the route table. ACK's
  # ec2-controller v1.23.1 has TransitGateway and TransitGatewayVPCAttachment
  # and none of these. Association and propagation link an attachment to a
  # route table; a route is a static route in one; a peering attachment is
  # the requester's side (the peer accepts it outside this kind).
  - typeName: AWS::EC2::TransitGatewayRoute
  - typeName: AWS::EC2::TransitGatewayRouteTableAssociation
  - typeName: AWS::EC2::TransitGatewayRouteTablePropagation
  - typeName: AWS::EC2::TransitGatewayPeeringAttachment
  # F07: Control Tower. ACK has no Control Tower controller, issue or pull
  # request. Enabled controls and baselines on an OU: a delete only
  # disables one.
  - typeName: AWS::ControlTower::EnabledControl
    unproven: "moto 5.2.5 has no controltower, and no other emulator exists"
  - typeName: AWS::ControlTower::EnabledBaseline
    unproven: "moto 5.2.5 has no controltower, and no other emulator exists"
  # F07: the landing zone. Deleting one decommissions it (the guardrails,
  # the log archive and audit accounts' setup, every enabled control), so
  # it is never deleted, and the retain-only admission policy makes every
  # object carry deletion-policy: retain (the builder, 2026-11-10; plan
  # section 9, question 15). No emulator has Control Tower: the fake's
  # backend is a test double of ours (the builder, 2026-11-10).
  - typeName: AWS::ControlTower::LandingZone
    neverDelete: true
  # F08: Route 53 beyond ACK's route53-controller v1.8.0 (HealthCheck,
  # HostedZone, RecordSet). DNSSEC signing for a hosted zone (a delete
  # disables signing: remove the zone's DS record at the parent first) and
  # its key-signing key; query logging; CIDR collections for IP-based
  # routing.
  - typeName: AWS::Route53::QueryLoggingConfig
  - typeName: AWS::Route53::DNSSEC
    unproven: "moto 5.2.5 has no EnableHostedZoneDNSSEC or DisableHostedZoneDNSSEC"
  - typeName: AWS::Route53::KeySigningKey
    unproven: "moto 5.2.5 has no Create/Activate/Deactivate/DeleteKeySigningKey"
  - typeName: AWS::Route53::CidrCollection
    unproven: "moto 5.2.5 has no Create/List/Change/DeleteCidrCollection"
  # F09: Route 53 Resolver beyond ACK's route53resolver-controller v1.11.0
  # (endpoints, rules, query log configurations and their associations):
  # DNS Firewall (domain lists, rule groups with their rules as a field,
  # rule group associations to VPCs, a VPC's fail-open setting) and a VPC's
  # DNSSEC validation and reverse-lookup autodefined rules.
  - typeName: AWS::Route53Resolver::ResolverDNSSECConfig
  - typeName: AWS::Route53Resolver::ResolverConfig
    unproven: "moto 5.2.5 has no GetResolverConfig or UpdateResolverConfig"
  - typeName: AWS::Route53Resolver::FirewallDomainList
    unproven: "moto 5.2.5 has none of Route 53 Resolver's DNS Firewall calls"
  - typeName: AWS::Route53Resolver::FirewallRuleGroup
    unproven: "moto 5.2.5 has none of Route 53 Resolver's DNS Firewall calls"
  - typeName: AWS::Route53Resolver::FirewallRuleGroupAssociation
    unproven: "moto 5.2.5 has none of Route 53 Resolver's DNS Firewall calls"
  - typeName: AWS::Route53Resolver::FirewallConfig
    unproven: "moto 5.2.5 has no GetFirewallConfig or UpdateFirewallConfig"
  # F14: AWS Config. ACK has no Config controller and no pull request
  # (community issue 2445 asks for one, rechecked 2026-11-09). The
  # recorder, its delivery channel, managed and custom rules, an
  # aggregator and the authorization another account gives it, and
  # organization conformance packs.
  - typeName: AWS::Config::ConfigurationRecorder
  - typeName: AWS::Config::DeliveryChannel
  - typeName: AWS::Config::ConfigRule
  - typeName: AWS::Config::ConfigurationAggregator
  - typeName: AWS::Config::AggregationAuthorization
  - typeName: AWS::Config::OrganizationConformancePack
  - typeName: AWS::Config::OrganizationConfigRule
    unproven: "moto 5.2.5 has no PutOrganizationConfigRule"
  - typeName: AWS::Config::ConformancePack
    unproven: "moto 5.2.5 has no PutConformancePack"
  - typeName: AWS::Config::RemediationConfiguration
    unproven: "moto 5.2.5 has no PutRemediationConfigurations"
  - typeName: AWS::Config::StoredQuery
    unproven: "moto 5.2.5 has no PutStoredQuery"
  - typeName: AWS::Config::Connector
    unproven: "moto 5.2.5 has no Config connectors"
  # F15: GuardDuty beside the detector. ACK has no GuardDuty controller
  # (community issue #2916, no pull request). moto 5.2.5 has filters; it
  # has none of the IP and threat intel sets, members, publishing
  # destinations, malware protection plans or invitations.
  - typeName: AWS::GuardDuty::Filter
  - typeName: AWS::GuardDuty::IPSet
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteIPSet"
  - typeName: AWS::GuardDuty::ThreatIntelSet
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteThreatIntelSet"
  - typeName: AWS::GuardDuty::Member
    unproven: "moto 5.2.5 has no Create/Get/DeleteMembers or InviteMembers"
  - typeName: AWS::GuardDuty::PublishingDestination
    unproven: "moto 5.2.5 has no Create/Describe/Update/DeletePublishingDestination"
  - typeName: AWS::GuardDuty::MalwareProtectionPlan
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteMalwareProtectionPlan"
  - typeName: AWS::GuardDuty::Master
    unproven: "moto 5.2.5 has no AcceptAdministratorInvitation or DisassociateFromAdministratorAccount"
  # F16: Security Hub. ACK has no Security Hub controller, issue or pull
  # request. moto 5.2.5 has the hub (enable, describe, disable) and the
  # organization configuration; it has enabling a delegated administrator
  # but not listing or disabling one, and none of standards, aggregators,
  # configuration policies, automation rules or action targets.
  - typeName: AWS::SecurityHub::Hub
  - typeName: AWS::SecurityHub::OrganizationConfiguration
  - typeName: AWS::SecurityHub::DelegatedAdmin
    unproven: "moto 5.2.5 has EnableOrganizationAdminAccount but no ListOrganizationAdminAccounts or DisableOrganizationAdminAccount"
  - typeName: AWS::SecurityHub::Standard
    unproven: "moto 5.2.5 has no BatchEnableStandards, GetEnabledStandards or BatchDisableStandards"
  - typeName: AWS::SecurityHub::FindingAggregator
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteFindingAggregator"
  - typeName: AWS::SecurityHub::ConfigurationPolicy
    unproven: "moto 5.2.5 has no Create/Get/Update/DeleteConfigurationPolicy"
  - typeName: AWS::SecurityHub::PolicyAssociation
    unproven: "moto 5.2.5 has no StartConfigurationPolicyAssociation or GetConfigurationPolicyAssociation"
  - typeName: AWS::SecurityHub::AutomationRule
    unproven: "moto 5.2.5 has no CreateAutomationRule or BatchGet/Update/DeleteAutomationRules"
  - typeName: AWS::SecurityHub::ActionTarget
    unproven: "moto 5.2.5 has no Create/Describe/Update/DeleteActionTarget(s)"
  # F17: Secrets Manager's resource policy on a secret. ACK's
  # secretsmanager-controller v1.8.2 serves Secret and not its policy (no
  # pull request); rotation waits for its pull request #69. The secret is
  # named by ARN or name (secretId); a reference to ACK's Secret waits for
  # the overlay.
  - typeName: AWS::SecretsManager::ResourcePolicy
  # Batch 9 (docs/throughput.md), security-adjacent: every gap type of the
  # security services the builder named that Cloud Control can serve, added
  # with hack/cloudcontrol-batch on 2026-11-11. ACK has no controller for
  # Access Analyzer, Macie, Inspector, Detective, Firewall Manager, Audit
  # Manager, Security Lake, GuardDuty or Security Hub (no issue or pull
  # request, rechecked 2026-11-11); for WAFv2, ACM, ACM PCA, Network Firewall
  # and Secrets Manager these types are ones the released controllers do not
  # serve. On the schema fake until a moto backend or a live run proves them.
  - typeName: AWS::AccessAnalyzer::Analyzer
    unproven: "moto 5.2.5 has no accessanalyzer; on the schema fake only"
  - typeName: AWS::AccessAnalyzer::ArchiveRule
    unproven: "moto 5.2.5 has no accessanalyzer; on the schema fake only"
  - typeName: AWS::ACMPCA::Permission
    unproven: "no moto backend yet (moto 5.2.5 has acmpca); on the schema fake only"
  - typeName: AWS::AuditManager::Assessment
    unproven: "moto 5.2.5 has no auditmanager; on the schema fake only"
  - typeName: AWS::AuditManager::AssessmentFramework
    unproven: "moto 5.2.5 has no auditmanager; on the schema fake only"
  - typeName: AWS::CertificateManager::Account
    unproven: "no moto backend yet (moto 5.2.5 has acm); on the schema fake only"
  - typeName: AWS::Detective::Graph
    unproven: "moto 5.2.5 has no detective; on the schema fake only"
  - typeName: AWS::Detective::MemberInvitation
    unproven: "moto 5.2.5 has no detective; on the schema fake only"
  - typeName: AWS::Detective::OrganizationAdmin
    unproven: "moto 5.2.5 has no detective; on the schema fake only"
  - typeName: AWS::FMS::ApplicationsList
    unproven: "moto 5.2.5 has no fms; on the schema fake only"
  - typeName: AWS::FMS::NotificationChannel
    unproven: "moto 5.2.5 has no fms; on the schema fake only"
  - typeName: AWS::FMS::Policy
    unproven: "moto 5.2.5 has no fms; on the schema fake only"
  - typeName: AWS::FMS::ProtocolsList
    unproven: "moto 5.2.5 has no fms; on the schema fake only"
  - typeName: AWS::FMS::ResourceSet
    unproven: "moto 5.2.5 has no fms; on the schema fake only"
  - typeName: AWS::GuardDuty::CustomDetectionRuleAssociation
    unproven: "no moto backend yet (moto 5.2.5 has guardduty); on the schema fake only"
  - typeName: AWS::GuardDuty::ThreatEntitySet
    unproven: "no moto backend yet (moto 5.2.5 has guardduty); on the schema fake only"
  - typeName: AWS::GuardDuty::TrustedEntitySet
    unproven: "no moto backend yet (moto 5.2.5 has guardduty); on the schema fake only"
  - typeName: AWS::InspectorV2::CisScanConfiguration
    unproven: "no moto backend yet (moto 5.2.5 has inspector2); on the schema fake only"
  - typeName: AWS::InspectorV2::CodeSecurityIntegration
    unproven: "no moto backend yet (moto 5.2.5 has inspector2); on the schema fake only"
  - typeName: AWS::InspectorV2::CodeSecurityScanConfiguration
    unproven: "no moto backend yet (moto 5.2.5 has inspector2); on the schema fake only"
  - typeName: AWS::InspectorV2::Connector
    unproven: "no moto backend yet (moto 5.2.5 has inspector2); on the schema fake only"
  - typeName: AWS::InspectorV2::Filter
    unproven: "no moto backend yet (moto 5.2.5 has inspector2); on the schema fake only"
  - typeName: AWS::Macie::AllowList
    unproven: "no moto backend yet (moto 5.2.5 has macie2); on the schema fake only"
  - typeName: AWS::Macie::CustomDataIdentifier
    unproven: "no moto backend yet (moto 5.2.5 has macie2); on the schema fake only"
  - typeName: AWS::Macie::FindingsFilter
    unproven: "no moto backend yet (moto 5.2.5 has macie2); on the schema fake only"
  - typeName: AWS::Macie::Member
    unproven: "no moto backend yet (moto 5.2.5 has macie2); on the schema fake only"
  - typeName: AWS::Macie::Session
    unproven: "no moto backend yet (moto 5.2.5 has macie2); on the schema fake only"
  - typeName: AWS::NetworkFirewall::ContainerAssociation
    unproven: "no moto backend yet (moto 5.2.5 has networkfirewall); on the schema fake only"
  - typeName: AWS::NetworkFirewall::LoggingConfiguration
    unproven: "no moto backend yet (moto 5.2.5 has networkfirewall); on the schema fake only"
  - typeName: AWS::NetworkFirewall::TLSInspectionConfiguration
    unproven: "no moto backend yet (moto 5.2.5 has networkfirewall); on the schema fake only"
  - typeName: AWS::NetworkFirewall::VpcEndpointAssociation
    unproven: "no moto backend yet (moto 5.2.5 has networkfirewall); on the schema fake only"
  - typeName: AWS::SecretsManager::SecretTargetAttachment
    unproven: "no moto backend yet (moto 5.2.5 has secretsmanager); on the schema fake only"
  - typeName: AWS::SecurityHub::AggregatorV2
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::AutomationRuleV2
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::Connector
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::ConnectorV2
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::HubV2
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::Insight
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::ProductSubscription
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityHub::SecurityControl
    unproven: "no moto backend yet (moto 5.2.5 has securityhub); on the schema fake only"
  - typeName: AWS::SecurityLake::AwsLogSource
    unproven: "moto 5.2.5 has no securitylake; on the schema fake only"
  - typeName: AWS::SecurityLake::DataLake
