  - endpoints
  - eventbuses
  - rules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - eventbridge.services.k8s.aws
  resources:
  - archives/status
  - endpoints/status
  - eventbuses/status
  - rules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - iam.services.k8s.aws
