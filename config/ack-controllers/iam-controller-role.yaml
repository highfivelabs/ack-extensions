# Copied from aws-controllers-k8s/iam-controller v1.11.3 (91ed7f353255e54e2c6372b3ce757bd2e7fae4ad)
# config/rbac/cluster-role-controller.yaml. Modified by High Five Labs for
# ack-extensions: renamed ack-iam-controller -> ack-extensions-ack-iam-controller
