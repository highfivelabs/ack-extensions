  - layerversions/status
  - versions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - mq.services.k8s.aws
  resources:
  - brokers
  - brokers/status
  verbs:
  - get
  - list
- apiGroups:
  - s3.services.k8s.aws
  resources:
  - buckets
  - buckets/status
  verbs:
  - get
  - list
- apiGroups:
  - secretsmanager.services.k8s.aws
  resources:
  - secrets
  - secrets/status
  verbs:
  - get
  - list
- apiGroups:
