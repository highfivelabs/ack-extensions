  names:
    kind: LifecycleHook
    listKind: LifecycleHookList
    plural: lifecyclehooks
    singular: lifecyclehook
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LifecycleHook is the Schema for the LifecycleHooks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LifecycleHookSpec defines the desired state of LifecycleHook.

              Describes a lifecycle hook. A lifecycle hook lets you create solutions that
              are aware of events in the Auto Scaling instance lifecycle, and then perform
              a custom action on instances when the corresponding lifecycle event occurs.
            properties:
              autoScalingGroupName:
                description: |-
                  The name of the Auto Scaling group.

                  Regex Pattern: `^[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              autoScalingGroupRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              defaultResult:
                description: |-
                  The action the Auto Scaling group takes when the lifecycle hook timeout elapses
                  or if an unexpected failure occurs. The default value is ABANDON.

                  Valid values: CONTINUE | ABANDON
                type: string
              heartbeatTimeout:
                description: |-
                  The maximum time, in seconds, that can elapse before the lifecycle hook times
                  out. The range is from 30 to 7200 seconds. The default value is 3600 seconds
                  (1 hour).
                format: int64
                type: integer
              lifecycleHookName:
                description: |-
                  The name of the lifecycle hook.

                  Regex Pattern: `^[A-Za-z0-9\-_\/]+$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              lifecycleTransition:
                description: |-
                  The lifecycle transition. For Auto Scaling groups, there are two major lifecycle
                  transitions.

                     * To create a lifecycle hook for scale-out events, specify autoscaling:EC2_INSTANCE_LAUNCHING.

                     * To create a lifecycle hook for scale-in events, specify autoscaling:EC2_INSTANCE_TERMINATING.

                  Required for new lifecycle hooks, but optional when updating existing hooks.
                type: string
              notificationMetadata:
                description: |-
                  Additional information that you want to include any time Amazon EC2 Auto
                  Scaling sends a message to the notification target.

                  Regex Pattern: `^[\u0009\u000A\u000D\u0020-\u007e]+$`
                type: string
              notificationTargetARN:
                description: |-
                  The Amazon Resource Name (ARN) of the notification target that Amazon EC2
                  Auto Scaling uses to notify you when an instance is in a wait state for the
                  lifecycle hook. You can specify either an Amazon SNS topic or an Amazon SQS
                  queue.

                  If you specify an empty string, this overrides the current ARN.

                  This operation uses the JSON format when sending notifications to an Amazon
                  SQS queue, and an email key-value pair format when sending notifications
                  to an Amazon SNS topic.

                  When you specify a notification target, Amazon EC2 Auto Scaling sends it
                  a test message. Test messages contain the following additional key-value
                  pair: "Event": "autoscaling:TEST_NOTIFICATION".

                  Regex Pattern: `^[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*$`
                type: string
              roleARN:
                description: |-
                  The ARN of the IAM role that allows the Auto Scaling group to publish to
                  the specified notification target.

                  Valid only if the notification target is an Amazon SNS topic or an Amazon
                  SQS queue. Required for new lifecycle hooks, but optional when updating existing
                  hooks.

                  Regex Pattern: `^[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*$`
                type: string
              roleRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
