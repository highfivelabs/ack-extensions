  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: defaultnetworkacls.ec2.aws.hfl.dev
spec:
  group: ec2.aws.hfl.dev
  names:
    categories:
    - aws
    - hfl
    kind: DefaultNetworkACL
    listKind: DefaultNetworkACLList
    plural: defaultnetworkacls
    shortNames:
    - hfldefaultnetworkacl
    singular: defaultnetworkacl
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcID
      name: VPC
      type: string
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DefaultNetworkACL is the Schema for the DefaultNetworkACLs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DefaultNetworkACLSpec takes over the default network ACL EC2 made with a
              VPC: it is found by the VPC (DescribeNetworkAcls, default=true), never
              created and never deleted. It is Terraform's aws_default_network_acl.

              The entries are exclusive, as Terraform's are: every entry the ACL has
              that the spec does not list is deleted, EC2's two default allow-all
              entries (rule 100, and 101 for IPv6) included, and the spec's entries
              are created or replaced. The deny-all entries numbered 32767 are EC2's
              and are neither listed nor touched. The entries take the shape of ACK's
              NetworkACL entries (ec2.services.k8s.aws).

              The subnets listed (subnetIDs, or subnetRefs to ACK's Subnet) are
              associated with the default ACL, moved from whatever ACL they had. A
              subnet that is on the default ACL but not listed cannot be moved off it
              from here (EC2 moves a subnet only onto another ACL); it is reported in
              status.unlistedSubnetIDs. The tags are exclusive too, except AWS's own
              (aws:).

              Deleting the object leaves the ACL, its entries and its subnets as they
              are.

              Exactly one of vpcID and vpcRef must be set.
            properties:
              entries:
                description: |-
                  The entries, ingress and egress (egress: true); none when empty
                  besides EC2's deny-all entries (32767).
                items:
                  description: Describes an entry in a network ACL.
                  properties:
                    cidrBlock:
                      type: string
                    egress:
                      type: boolean
                    icmpTypeCode:
                      description: Describes the ICMP type and code.
                      properties:
                        code:
                          format: int64
                          type: integer
                        type_:
                          format: int64
                          type: integer
                      type: object
                    ipv6CIDRBlock:
                      type: string
                    portRange:
                      description: Describes a range of ports.
                      properties:
                        from:
                          format: int64
                          type: integer
                        to:
                          format: int64
                          type: integer
                      type: object
                    protocol:
                      type: string
                    ruleAction:
                      type: string
                    ruleNumber:
                      format: int64
                      type: integer
                  type: object
                type: array
              subnetIDs:
                description: The subnets to associate with the default ACL.
                items:
                  type: string
                type: array
              subnetRefs:
                description: |-
                  ACK Subnets (ec2.services.k8s.aws) whose status.subnetID is
                  associated with the default ACL, beside subnetIDs.
                items:
                  description: "AWSResourceReferenceWrapper provides a wrapper around
                    *AWSResourceReference\ntype to provide more user friendly syntax
                    for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                    \ name: my-api"
                  properties:
                    from:
                      description: |-
                        AWSResourceReference provides all the values necessary to reference another
                        k8s resource for finding the identifier(Id/ARN/Name)
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      type: object
                  type: object
                type: array
              tags:
                description: The ACL's tags.
                items:
                  description: Describes a tag.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              vpcID:
                description: The ID of the VPC whose default network ACL this is.
                  Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              vpcRef:
                description: An ACK VPC (ec2.services.k8s.aws) whose status.vpcID
                  is the VPC.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of vpcID and vpcRef must be set
              rule: '[has(self.vpcID), has(self.vpcRef)].filter(x, x).size() == 1'
          status:
            description: DefaultNetworkACLStatus defines the observed state of DefaultNetworkACL.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              id:
                description: The ID of the VPC's default network ACL.
                type: string
              unlistedSubnetIDs:
                description: |-
                  Subnets on the default ACL that the spec does not list. EC2 cannot
                  take a subnet off the default ACL except by putting it on another.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
