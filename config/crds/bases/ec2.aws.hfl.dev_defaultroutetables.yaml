        description: DefaultRouteTable is the Schema for the DefaultRouteTables API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DefaultRouteTableSpec takes over the main route table EC2 made with a
              VPC: it is found by the VPC (DescribeRouteTables, association.main=true),
              never created and never deleted. It is Terraform's
              aws_default_route_table.

              The routes are exclusive, as Terraform's are: every route the table has
              that the spec does not list is deleted, and the spec's are created. The
              VPC's local route (origin CreateRouteTable) and routes a virtual private
              gateway propagates (origin EnableVgwRoutePropagation) are EC2's and are
              neither listed nor touched. The routes take the shape of ACK's
              RouteTable routes (ec2.services.k8s.aws), references included
              (gatewayRef to ACK's InternetGateway, natGatewayRef, transitGatewayRef,
              vpcEndpointRef, vpcPeeringConnectionRef).

              The virtual private gateways listed in propagatingVGWs propagate their
              routes to the table and no other gateway does (exclusive). The tags are
              exclusive too, except AWS's own (aws:).

              Deleting the object leaves the table, its routes and propagations as
              they are.

              Exactly one of vpcID and vpcRef must be set.
            properties:
              propagatingVGWs:
                description: |-
                  The IDs of the virtual private gateways that propagate routes to the
                  table.
                items:
                  type: string
                type: array
              routes:
                description: The routes; none when empty besides the local route.
                items:
                  properties:
                    carrierGatewayID:
                      type: string
                    coreNetworkARN:
                      type: string
                    destinationCIDRBlock:
                      type: string
                    destinationIPv6CIDRBlock:
                      type: string
                    destinationPrefixListID:
                      type: string
                    egressOnlyInternetGatewayID:
                      type: string
                    gatewayID:
                      type: string
                    gatewayRef:
                      description: Reference field for GatewayID
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    instanceID:
                      type: string
                    localGatewayID:
                      type: string
                    natGatewayID:
                      type: string
                    natGatewayRef:
                      description: Reference field for NATGatewayID
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    networkInterfaceID:
                      type: string
                    transitGatewayID:
                      type: string
                    transitGatewayRef:
                      description: Reference field for TransitGatewayID
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    vpcEndpointID:
                      type: string
                    vpcEndpointRef:
                      description: Reference field for VPCEndpointID
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                    vpcPeeringConnectionID:
                      type: string
                    vpcPeeringConnectionRef:
                      description: Reference field for VPCPeeringConnectionID
                      properties:
                        from:
                          description: |-
                            AWSResourceReference provides all the values necessary to reference another
                            k8s resource for finding the identifier(Id/ARN/Name)
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                  type: object
                type: array
              tags:
                description: The table's tags.
                items:
                  description: Describes a tag.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              vpcID:
                description: The ID of the VPC whose main route table this is. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              vpcRef:
                description: An ACK VPC (ec2.services.k8s.aws) whose status.vpcID
                  is the VPC.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of vpcID and vpcRef must be set
              rule: '[has(self.vpcID), has(self.vpcRef)].filter(x, x).size() == 1'
          status:
            description: DefaultRouteTableStatus defines the observed state of DefaultRouteTable.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              id:
                description: The ID of the VPC's main route table.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
