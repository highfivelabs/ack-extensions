---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: resourcetags.ec2.aws.hfl.dev
spec:
  group: ec2.aws.hfl.dev
  names:
    categories:
    - aws
    - hfl
    kind: ResourceTag
    listKind: ResourceTagList
    plural: resourcetags
    shortNames:
    - hflresourcetag
    singular: resourcetag
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.resourceID
      name: RESOURCE
      type: string
    - jsonPath: .spec.key
      name: KEY
      type: string
    - jsonPath: .spec.value
      name: VALUE
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ResourceTag is the Schema for the ResourceTags API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ResourceTagSpec is one tag on one EC2 resource made elsewhere (by
              another team, by AWS for an EKS node group, by Terraform, or shared
              from another account with RAM): put with CreateTags, read with
              DescribeTags, removed with DeleteTags. It is Terraform's aws_ec2_tag.

              It is for resources whose tags nothing else manages. On a resource an
              ACK kind manages, ACK syncs the whole tag set and removes a tag its spec
              does not list, so the two would undo each other: list the tag in that
              kind's spec.tags instead.
            properties:
              key:
                description: 'The tag''s key. Immutable: another key is another tag.'
                maxLength: 128
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              resourceID:
                description: |-
                  The ID of the EC2 resource: a VPC, subnet, security group, route
                  table, transit gateway attachment, instance, volume, or any other
                  resource CreateTags takes. Immutable.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              value:
                description: |-
                  The tag's value; may be empty. Changed in place, and put back if
                  changed outside Kubernetes.
                maxLength: 256
                type: string
            required:
            - key
            - resourceID
            - value
            type: object
          status:
            description: ResourceTagStatus defines the observed state of ResourceTag.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              resourceType:
                description: |-
                  The type of the tagged resource, as DescribeTags gives it (vpc,
                  subnet, security-group, ...).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
