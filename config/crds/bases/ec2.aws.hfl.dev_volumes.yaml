---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: volumes.ec2.aws.hfl.dev
spec:
  group: ec2.aws.hfl.dev
  names:
    kind: Volume
    listKind: VolumeList
    plural: volumes
    singular: volume
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.volumeID
      name: ID
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Volume is the Schema for the Volumes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VolumeSpec defines the desired state of Volume.

              Describes a volume.
            properties:
              availabilityZone:
                description: |-
                  The ID of the Availability Zone in which to create the volume. For example,
                  us-east-1a.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              encrypted:
                description: |-
                  Indicates whether the volume should be encrypted. The effect of setting the
                  encryption state to true depends on the volume origin (new or from a snapshot),
                  starting encryption state, ownership, and whether encryption by default is
                  enabled. For more information, see Encryption by default (https://docs.aws.amazon.com/ebs/latest/userguide/work-with-ebs-encr.html#encryption-by-default)
                  in the Amazon EBS User Guide.

                  Encrypted Amazon EBS volumes must be attached to instances that support Amazon
                  EBS encryption. For more information, see Supported instance types (https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption-requirements.html#ebs-encryption_supported_instances).
                type: boolean
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              iops:
                description: |-
                  The number of I/O operations per second (IOPS). For gp3, io1, and io2 volumes,
                  this represents the number of IOPS that are provisioned for the volume. For
                  gp2 volumes, this represents the baseline performance of the volume and the
                  rate at which the volume accumulates I/O credits for bursting.

                  The following are the supported values for each volume type:

                     * gp3: 3,000 - 16,000 IOPS

                     * io1: 100 - 64,000 IOPS

                     * io2: 100 - 256,000 IOPS

                  For io2 volumes, you can achieve up to 256,000 IOPS on instances built on
                  the Nitro System (https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html).
                  On other instances, you can achieve performance up to 32,000 IOPS.

                  This parameter is required for io1 and io2 volumes. The default for gp3 volumes
                  is 3,000 IOPS. This parameter is not supported for gp2, st1, sc1, or standard
                  volumes.
                format: int64
                type: integer
              kmsKeyID:
                description: |-
                  The identifier of the KMS key to use for Amazon EBS encryption. If this parameter
                  is not specified, your KMS key for Amazon EBS is used. If KmsKeyId is specified,
                  the encrypted state must be true.

                  You can specify the KMS key using any of the following:

                     * Key ID. For example, 1234abcd-12ab-34cd-56ef-1234567890ab.

                     * Key alias. For example, alias/ExampleAlias.

                     * Key ARN. For example, arn:aws:kms:us-east-1:012345678910:key/1234abcd-12ab-34cd-56ef-1234567890ab.

                     * Alias ARN. For example, arn:aws:kms:us-east-1:012345678910:alias/ExampleAlias.

                  Amazon Web Services authenticates the KMS key asynchronously. Therefore,
                  if you specify an ID, alias, or ARN that is not valid, the action can appear
                  to complete, but eventually fails.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              multiAttachEnabled:
                description: |-
                  Indicates whether to enable Amazon EBS Multi-Attach. If you enable Multi-Attach,
                  you can attach the volume to up to 16 Instances built on the Nitro System
                  (https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html)
                  in the same Availability Zone. This parameter is supported with io1 and io2
                  volumes only. For more information, see Amazon EBS Multi-Attach (https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html)
                  in the Amazon EBS User Guide.
                type: boolean
              outpostARN:
                description: |-
                  The Amazon Resource Name (ARN) of the Outpost on which to create the volume.

                  If you intend to use a volume with an instance running on an outpost, then
                  you must create the volume on the same outpost as the instance. You can't
                  use a volume created in an Amazon Web Services Region with an instance on
                  an Amazon Web Services outpost, or the other way around.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              size:
                description: |-
                  The size of the volume, in GiBs. You must specify either a snapshot ID or
                  a volume size. If you specify a snapshot, the default is the snapshot size.
                  You can specify a volume size that is equal to or larger than the snapshot
                  size.

                  The following are the supported volumes sizes for each volume type:

                     * gp2 and gp3: 1 - 16,384 GiB

                     * io1: 4 - 16,384 GiB

                     * io2: 4 - 65,536 GiB

                     * st1 and sc1: 125 - 16,384 GiB

                     * standard: 1 - 1024 GiB
                format: int64
                type: integer
              snapshotID:
                description: |-
                  The snapshot from which to create the volume. You must specify either a snapshot
                  ID or a volume size.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              tags:
                description: |-
                  The tags. The value parameter is required, but if you don't want the tag
                  to have a value, specify the parameter with no value, and we set the value
                  to an empty string.
                items:
                  description: Describes a tag.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              throughput:
                description: |-
                  The throughput to provision for a volume, with a maximum of 1,000 MiB/s.

                  This parameter is valid only for gp3 volumes.

                  Valid Range: Minimum value of 125. Maximum value of 1000.
                format: int64
                type: integer
              volumeType:
                description: |-
                  The volume type. This parameter can be one of the following values:

                     * General Purpose SSD: gp2 | gp3

                     * Provisioned IOPS SSD: io1 | io2

                     * Throughput Optimized HDD: st1

                     * Cold HDD: sc1

                     * Magnetic: standard

                  Throughput Optimized HDD (st1) and Cold HDD (sc1) volumes can't be used as
                  boot volumes.

                  For more information, see Amazon EBS volume types (https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html)
                  in the Amazon EBS User Guide.

                  Default: gp2
                type: string
            required:
            - availabilityZone
            type: object
          status:
            description: VolumeStatus defines the observed state of Volume
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              createTime:
                description: The time stamp when volume creation was initiated.
                format: date-time
                type: string
              fastRestored:
                description: |-
                  This parameter is not returned by CreateVolume.

                  Indicates whether the volume was created using fast snapshot restore.
                type: boolean
              operator:
                description: The service provider that manages the volume.
                properties:
                  managed:
                    type: boolean
                  principal:
                    type: string
                type: object
              sseType:
                description: |-
                  This parameter is not returned by CreateVolume.

                  Reserved for future use.
                type: string
              state:
                description: The volume state.
                type: string
              volumeID:
                description: The ID of the volume.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
