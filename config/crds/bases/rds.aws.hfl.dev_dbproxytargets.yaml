---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: dbproxytargets.rds.aws.hfl.dev
spec:
  group: rds.aws.hfl.dev
  names:
    categories:
    - aws
    - hfl
    kind: DBProxyTarget
    listKind: DBProxyTargetList
    plural: dbproxytargets
    shortNames:
    - hfldbproxytarget
    singular: dbproxytarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dbProxyName
      name: PROXY
      type: string
    - jsonPath: .status.targets[0].targetHealth.state
      name: HEALTH
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DBProxyTarget is the Schema for the DBProxyTargets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DBProxyTargetSpec registers one RDS DB instance or one Aurora DB cluster
              as a target of an RDS Proxy's target group (RegisterDBProxyTargets).

              ACK's DBProxy creates the proxy but never registers what it fronts, so
              without a target a proxy accepts no connections. Exactly one of the
              instance and cluster fields (or their references) must be set.
            properties:
              dbClusterIdentifier:
                description: |-
                  The identifier of an Aurora DB cluster to register. RDS Proxy then
                  tracks the cluster's writer and readers itself. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              dbClusterRef:
                description: |-
                  An ACK rds.services.k8s.aws DBCluster whose spec.dbClusterIdentifier
                  is the cluster.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              dbInstanceIdentifier:
                description: The identifier of an RDS DB instance to register. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              dbInstanceRef:
                description: |-
                  An ACK rds.services.k8s.aws DBInstance whose
                  spec.dbInstanceIdentifier is the instance.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              dbProxyName:
                description: The name of the DB proxy. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              dbProxyRef:
                description: An ACK rds.services.k8s.aws DBProxy whose spec.name is
                  the proxy.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              targetGroupName:
                description: |-
                  The proxy's target group. RDS Proxy has exactly one, "default", and
                  that is the default here. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
            type: object
            x-kubernetes-validations:
            - message: exactly one of dbInstanceIdentifier, dbInstanceRef, dbClusterIdentifier
                and dbClusterRef must be set
              rule: '[has(self.dbInstanceIdentifier), has(self.dbInstanceRef), has(self.dbClusterIdentifier),
                has(self.dbClusterRef)].filter(x, x).size() == 1'
            - message: exactly one of dbProxyName and dbProxyRef must be set
              rule: '[has(self.dbProxyName), has(self.dbProxyRef)].filter(x, x).size()
                == 1'
          status:
            description: DBProxyTargetStatus defines the observed state of DBProxyTarget.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              targets:
                description: The targets RDS Proxy reports for this registration.
                items:
                  description: |-
                    DBProxyTargetObservation is one target RDS Proxy reports for this
                    registration: the instance, or for a cluster the tracked cluster and
                    each of its instances.
                  properties:
                    endpoint:
                      type: string
                    port:
                      format: int64
                      type: integer
                    rdsResourceID:
                      type: string
                    role:
                      type: string
                    targetARN:
                      type: string
                    targetHealth:
                      description: |-
                        DBProxyTargetHealth is RDS Proxy's view of whether it can reach a
                        target.
                      properties:
                        description:
                          type: string
                        reason:
                          type: string
                        state:
                          description: REGISTERING, AVAILABLE or UNAVAILABLE.
                          type: string
                      type: object
                    type:
                      description: RDS_INSTANCE, RDS_SERVERLESS_ENDPOINT or TRACKED_CLUSTER.
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
