---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: objects.s3.aws.hfl.dev
spec:
  group: s3.aws.hfl.dev
  names:
    categories:
    - aws
    - hfl
    kind: Object
    listKind: ObjectList
    plural: objects
    shortNames:
    - hflobject
    singular: object
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bucketName
      name: BUCKET
      type: string
    - jsonPath: .spec.key
      name: KEY
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Object is the Schema for the Objects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ObjectSpec is one object in an S3 bucket, put with PutObject, read with
              HeadObject and deleted with DeleteObject: Terraform's aws_s3_object.
              S3 objects have no CloudFormation type and ACK's s3-controller has no
              kind for them (docs/plan.md open question 27, answered 2026-11-23).

              The content is one of content (text), contentBase64 (bytes) or
              contentFrom (a key of a ConfigMap or Secret, put again when its value
              changes). An object is small: the API server bounds an object, about
              1.5 MB, so inline content is bounded too.
            properties:
              bucketName:
                description: The bucket's name. Immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              bucketRef:
                description: |-
                  ACK's Bucket (s3.services.k8s.aws) to put the object in: its
                  spec.name, once it is synced.
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              cacheControl:
                type: string
              content:
                description: The content, as text (Terraform's content).
                type: string
              contentBase64:
                description: The content, base64-encoded (Terraform's content_base64).
                type: string
              contentDisposition:
                type: string
              contentEncoding:
                type: string
              contentFrom:
                description: |-
                  The content from a key of a ConfigMap or Secret. A changed value is
                  put again (the SHA-256 of what was put is kept in the annotation
                  s3.aws.hfl.dev/last-content-sha256).
                properties:
                  configMapKeyRef:
                    description: A key of a ConfigMap (its data, or its binaryData).
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  secretKeyRef:
                    description: A key of a Secret.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of configMapKeyRef and secretKeyRef
                  rule: has(self.configMapKeyRef) != has(self.secretKeyRef)
              contentLanguage:
                type: string
              contentType:
                type: string
              key:
                description: 'The object''s key. Immutable: another key is another
                  object.'
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              kmsKeyID:
                description: The KMS key for aws:kms, by ID or ARN.
                type: string
              metadata:
                additionalProperties:
                  type: string
                description: |-
                  User-defined metadata (x-amz-meta-*), keys in lower case as S3 keeps
                  them.
                type: object
              serverSideEncryption:
                description: |-
                  AES256, aws:kms or aws:kms:dsse; without it the bucket's default
                  encryption applies.
                enum:
                - AES256
                - aws:kms
                - aws:kms:dsse
                type: string
              storageClass:
                description: STANDARD, STANDARD_IA, ...; without it STANDARD.
                type: string
              tags:
                description: The object's tags (PutObjectTagging), at most 10.
                items:
                  description: A container of a key value name pair.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                maxItems: 10
                type: array
            required:
            - key
            type: object
            x-kubernetes-validations:
            - message: exactly one of bucketName and bucketRef
              rule: has(self.bucketName) != has(self.bucketRef)
            - message: exactly one of content, contentBase64 and contentFrom
              rule: '(has(self.content) ? 1 : 0) + (has(self.contentBase64) ? 1 :
                0) + (has(self.contentFrom) ? 1 : 0) == 1'
          status:
            description: ObjectStatus defines the observed state of Object.
            properties:
              ackResourceMetadata:
                description: |-
                  ResourceMetadata is common to all custom resources (CRs) managed by an ACK
                  service controller. It is contained in the CR's `Status` member field and
                  comprises various status and identifier fields useful to ACK for tracking
                  state changes between Kubernetes and the backend AWS service API
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              eTag:
                description: |-
                  The ETag of the content put; a different ETag read means the object
                  was changed outside Kubernetes, and it is put again.
                type: string
              versionID:
                description: The version put, in a bucket with versioning.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
