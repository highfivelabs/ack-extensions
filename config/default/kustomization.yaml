# Everything to install beside ACK: our CRDs, the managers' ClusterRoles,
# the admission policies, ACKContext and the operator; and the Cloud Control kinds'
# CRDs, CloudControlContext and the Cloud Control manager's ClusterRole
# (bound per namespace). `kubectl kustomize config/default | ko resolve -f -`.
resources:
  - ../crds
  - ../rbac
  - ../admission
  - ../context
  - ../operator
  - ../../cloudcontrol/config/crds
  - ../../cloudcontrol/config/context
  - ../../cloudcontrol/config/rbac
