#
# The fake AWS for tests on kind: moto in server mode, the same version the
# Go tests use (hack/moto-requirements.txt). tests/operator/run.sh checks
# that the tag still has the digest
#   sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
# then pulls it for the node's platform and loads it into kind (kind and
# containerd mishandle an image known only by digest). Test only:
# config/default never includes it.
apiVersion: v1
kind: Namespace
metadata:
  name: fake-aws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: fake-aws
spec:
  replicas: 1
  selector:
    matchLabels: {app: moto}
  template:
    metadata:
      labels: {app: moto}
    spec:
      # A Service named moto makes Kubernetes set MOTO_PORT=tcp://...,
      # which moto reads as its port.
      enableServiceLinks: false
      containers:
        - name: moto
          image: docker.io/motoserver/moto:5.2.5
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /moto-api/, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: fake-aws
spec:
  selector: {app: moto}
  ports:
    - port: 5000
      targetPort: 5000
