#
# The operator holds no AWS credentials. It reads ACK's controller
# Deployments and ServiceAccounts, and makes, beside each, a manager
# Deployment, a ServiceAccount (identity "own"), a leader-election Role and
# RoleBinding, and a ClusterRoleBinding to the manager's ClusterRole. It
# may bind only our manager ClusterRoles (RBAC "bind" by name).
# For Cloud Control it reads CloudControlContexts (and puts its finalizer
# on them), and makes for each a ServiceAccount and a manager Deployment in
# its own namespace, and in the context's namespace a RoleBinding to the
# Cloud Control manager's ClusterRole (rights in that namespace only).
# For ACKContexts the same, per controller the context enables: a
# ServiceAccount and a manager Deployment in its own namespace, and in the
# context's namespace a RoleBinding to that service's manager ClusterRole
# and a leader-election Role and RoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ack-extensions-operator
  namespace: ack-extensions-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ack-extensions-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["ack-extensions-applicationautoscaling-manager", "ack-extensions-autoscaling-manager", "ack-extensions-ec2-manager", "ack-extensions-ecr-manager", "ack-extensions-eventbridge-manager", "ack-extensions-iam-manager", "ack-extensions-kms-manager", "ack-extensions-lambda-manager", "ack-extensions-organizations-manager", "ack-extensions-rds-manager", "ack-extensions-s3control-manager", "ack-extensions-scheduler-manager", "ack-extensions-wafv2-manager", "ack-extensions-cloudcontrol-manager"]
  - apiGroups: ["core.aws.hfl.dev"]
    resources: ["ackcontexts"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["core.aws.hfl.dev"]
    resources: ["ackcontexts/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cloudcontrol.aws.hfl.dev"]
    resources: ["cloudcontrolcontexts"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["cloudcontrol.aws.hfl.dev"]
    resources: ["cloudcontrolcontexts/status"]
    verbs: ["get", "update", "patch"]
  # The rules of the leader-election Role it makes for each manager:
  # Kubernetes lets a Role be made only by someone who holds its rules.
  # The events rule also lets it record why it refuses a manager (a Warning
  # on ACK's controller Deployment).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ack-extensions-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ack-extensions-operator
subjects:
  - kind: ServiceAccount
    name: ack-extensions-operator
    namespace: ack-extensions-system
