---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ack-extensions-autoscaling-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.aws.hfl.dev
  resources:
  - autoscalinggroups
  - lifecyclehooks
  - scalingpolicies
  - scheduledactions
  - trafficsourceattachments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.aws.hfl.dev
  resources:
  - autoscalinggroups/status
  - lifecyclehooks/status
  - scalingpolicies/status
  - scheduledactions/status
  - trafficsourceattachments/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ec2.aws.hfl.dev
  resources:
  - launchtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ec2.services.k8s.aws
  resources:
  - capacityreservations
  - capacityreservations/status
  - instances
  - instances/status
  - launchtemplates
  - launchtemplates/status
  verbs:
  - get
  - list
- apiGroups:
  - elbv2.services.k8s.aws
  resources:
  - targetgroups
  - targetgroups/status
  verbs:
  - get
  - list
- apiGroups:
  - iam.services.k8s.aws
  resources:
  - roles
  - roles/status
  - servicelinkedroles
  - servicelinkedroles/status
  verbs:
  - get
  - list
- apiGroups:
  - services.k8s.aws
  resources:
  - fieldexports
  - iamroleselectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - services.k8s.aws
  resources:
  - fieldexports/status
  - iamroleselectors/status
  verbs:
  - get
  - patch
  - update
