queue:
  - id: F01
    title: "AWS Organizations: SCPs and the other policy types, attachment, delegated administrators, organization features, account placement"
    resources: ["organizations/Policy", "organizations/Organization", "organizations/Account", "organizations/ResourcePolicy"]
    why: "The builder's first ask: manage accounts, OUs and SCPs early and show it to platform teams. ACK ships `Account` and `OrganizationalUnit` but ignores `Policy` and `Organization`, so there is no way to declare an SCP, attach it, delegate an administrator or enable a policy type. Three of the five Organizations resources in CloudFormation are open here, and the API has more (delegated administrators, service access and policy-type enablement have no CloudFormation resource, so they are in none of the coverage numbers)."
    kinds: |
      In `organizations.aws.hfl.dev`, beside ACK's `Account` and `OrganizationalUnit`:
      (1) `Policy`: generated from `CreatePolicy`/`DescribePolicy`/`UpdatePolicy`/`DeletePolicy`; `name`, `description`, `type` (immutable: `SERVICE_CONTROL_POLICY`, `TAG_POLICY`, `BACKUP_POLICY`, `AISERVICES_OPT_OUT_POLICY` and the newer types), `content` (a JSON document, compared as canonical JSON), `tags`.
      (2) `PolicyAttachment`: hand-written on the `RolePolicyAttachment` skeleton (iam-controller PR #184): `policyID` or `policyRef`, `targetID` or `targetRef` (ACK's `OrganizationalUnit` or `Account`, or the root), `AttachPolicy`/`DetachPolicy`, read with `ListPoliciesForTarget`; non-exclusive (it never detaches policies it did not attach), the precedent being `Role.policies` against `RolePolicyAttachment`. CloudFormation's `Policy.TargetIds` is the exclusive form: do not add it to `Policy`.
      (3) `DelegatedAdministrator`: hand-written, `accountID` or `accountRef` and `servicePrincipal`; `RegisterDelegatedAdministrator`/`DeregisterDelegatedAdministrator`, read with `ListDelegatedAdministrators`.
      (4) `Organization`: hand-written singleton on the shape of our `ReplicationConfiguration`: `featureSet`, `enabledPolicyTypes[]` (`EnablePolicyType`/`DisablePolicyType` on the root), `awsServiceAccessPrincipals[]` (`EnableAWSServiceAccess`/`DisableAWSServiceAccess`); adopts the existing organization, creating one only if told to.
      (5) `AccountPlacement`: hand-written sidecar by `accountRef`/`accountID` and `parentID`/`parentRef`: `MoveAccount`, read with `ListParents` (community #2369).
    upstream: "ACK `organizations-controller` v1.7.0 has `Account` and `OrganizationalUnit`; its `generator.yaml` ignores `Policy`, `Organization` and `GovCloudAccount`. Community #2884 (2026-05-11) proposes `Policy`, `PolicyAttachment` and `DelegatedAdministrator` in three PRs and the reporter offers to write them; no pull request is open at 2026-11-09. The rule in `CLAUDE.md` and plan section 3: build here when upstream has neither released nor a PR close to merging; that is the case today. Recheck #2884 before starting each kind and re-copy if a PR appears."
    moto: "Good: `CreateOrganization`, `CreateAccount`, `CreateOrganizationalUnit`, `CreatePolicy`/`UpdatePolicy`/`DeletePolicy`, `AttachPolicy`/`DetachPolicy`, `EnablePolicyType`, `EnableAWSServiceAccess`, `RegisterDelegatedAdministrator`/`DeregisterDelegatedAdministrator`, `MoveAccount`, `ListPoliciesForTarget`, `ListRoots`, `TagResource` are implemented, so kinds (1) to (5) can be proved end to end. Not implemented: `PutResourcePolicy` (so `ResourcePolicy` cannot be proved), `DescribeEffectivePolicy`, `EnableAllFeatures`, `InviteAccountToOrganization`."
    modules: "None of the 40 tracked terraform-aws-modules creates an Organizations resource (Terraform users use `aws_organizations_*` directly, or a landing-zone module outside the tracked set); a module need of 0 here is a gap in the module space, not low demand."
    size: "M (Policy), M (PolicyAttachment), S (DelegatedAdministrator), M (Organization), S (AccountPlacement); plus one for the new `services/organizations/` manager"
    approach: |
      Start with `Policy`: create `services/organizations/` like `services/rds/`: a `generator.yaml` that ignores `Account` and `OrganizationalUnit` (ACK has them) and configures `Policy` (start from the shape of ACK's `OrganizationalUnit` entry at organizations-controller commit `5824700fd7`), generate with `hack/generate.sh`, add the manager to the operator's mapping and `config/rbac`. The SDK client is `github.com/aws/aws-sdk-go-v2/service/organizations`; pin it to the version ACK's `organizations-controller` v1.7.0 `go.mod` names, as `UPSTREAM.md` does for the others. Then `PolicyAttachment` and `DelegatedAdministrator` by copying `services/iam/pkg/resource/role_policy_attachment/`, and `Organization` from `services/ecr/pkg/resource/replication_configuration/`.
      An SCP document is JSON: reuse the canonical-JSON comparison of `services/lambda/pkg/resource/permission/` (it reads policy statements) so key order and whitespace do not cause a delta. Test only what moto implements and write the rest in `docs/plan.md`, as the fake cloud's doc requires.
    done: "Each kind has an end-to-end test in `tests/e2e` on moto (create, update or refusal, delete, `deletion-policy: retain`); `task check` passes; the README table and `docs/plan.md` list the kinds; `task coverage` shows `organizations/Policy` at 100% and moves the `organizations` bar; `PolicyAttachment` attaches a policy to an ACK-made `OrganizationalUnit` by `targetRef` in one apply."

  - id: F02
    title: "IAM Identity Center: permission sets and account assignments"
    resources: ["sso/PermissionSet", "sso/Assignment", "sso/Instance", "sso/InstanceAccessControlAttributeConfiguration"]
    why: "How people get into accounts: a platform team's access model is permission sets assigned to groups per account. ACK has no controller (the `ssoadmin-controller` repository is empty), no PR, only an open request since 2023. It is the other half of the builder's account story."
    kinds: |
      In `ssoadmin.aws.hfl.dev` (ACK's service id is `ssoadmin`, so the group will match when ACK ships one; CloudFormation calls the service `sso`):
      (1) `PermissionSet`: `name`, `description`, `sessionDuration`, `relayState`, `tags`, `managedPolicies[]` (ARNs), `customerManagedPolicyReferences[]` (name and path), `inlinePolicy` (JSON), `permissionsBoundary`; `instanceARN` or the organization's only instance found with `ListInstances`. Generated base from `CreatePermissionSet`/`DescribePermissionSet`/`UpdatePermissionSet`/`DeletePermissionSet`, with hooks for the attachment APIs (`AttachManagedPolicyToPermissionSet`, `AttachCustomerManagedPolicyReferenceToPermissionSet`, `PutInlinePolicyToPermissionSet`, `PutPermissionsBoundaryToPermissionSet`) and `ProvisionPermissionSet` after a change that reaches assigned accounts.
      (2) `Assignment`: hand-written on the `RolePolicyAttachment` skeleton: `permissionSetRef`/`permissionSetARN`, `principalType` (`USER` or `GROUP`), `principalID`, `targetAccountID` or `targetAccountRef` (ACK's organizations `Account`); `CreateAccountAssignment`/`DeleteAccountAssignment` are asynchronous, so synced waits on `DescribeAccountAssignmentCreationStatus`; read with `ListAccountAssignments`.
      (3) `InstanceAccessControlAttributeConfiguration`: hand-written singleton, low priority (attribute-based access control).
      `Instance` is not a kind: an organization has one instance, found by `ListInstances` (creating one is a console act or `CreateInstance`); take `instanceARN` as a field.
    upstream: "No controller release: `ssoadmin-controller` holds only the 2023-07-27 initial commit. Community #1857 (open, three reactions). No pull request. Nothing to copy but ACK's conventions."
    moto: "Mostly good: `CreatePermissionSet`/`DescribePermissionSet`/`UpdatePermissionSet`, `AttachManagedPolicyToPermissionSet`, `AttachCustomerManagedPolicyReferenceToPermissionSet`, `PutInlinePolicyToPermissionSet`, `CreateAccountAssignment`/`DeleteAccountAssignment`/`ListAccountAssignments`/`DescribeAccountAssignmentCreationStatus`, `ProvisionPermissionSet`, `ListInstances`. Not implemented: `PutPermissionsBoundaryToPermissionSet` and `CreateInstanceAccessControlAttributeConfiguration`: those two cannot be proved."
    modules: "0 of 40: no terraform-aws-modules module wraps Identity Center (the Terraform resources are `aws_ssoadmin_*`)."
    size: "L (PermissionSet: six APIs behind one kind), M (Assignment: async), S (attribute config); plus one for the new `services/ssoadmin/` manager"
    approach: |
      Copy conventions from `services/iam/`. `PermissionSet` is the hard one: ACK's code generator makes the base kind from the Create/Describe pair, but policy attachment is a set of separate calls, so write the diff of `managedPolicies[]` and `customerManagedPolicyReferences[]` as an update hook (`ListManagedPoliciesInPermissionSet`, `ListCustomerManagedPolicyReferencesInPermissionSet`, `GetInlinePolicyForPermissionSet`); ram-controller's `ResourceShare` update hook (`templates/hooks/resource_share/sdk_update_pre_build_request.go.tpl`) is a worked example of syncing a list through separate calls. Call `ProvisionPermissionSet` only after an update, and report not-synced until its request status is `SUCCEEDED`.
      Do not write `identitystore` here: users and groups are item F12.
    done: "`PermissionSet` and `Assignment` pass end-to-end tests on moto (create, update a policy list and see `ProvisionPermissionSet` called, delete, retain); the two moto-less calls are listed in `docs/plan.md` as untested; a chart can create a permission set and assign it to an ACK `Account` by reference; `task check` passes; `task coverage` shows `sso` above 0%."

  - id: F03
    title: "IAM: SAML providers (and the access-key question)"
    resources: ["iam/SAMLProvider", "iam/AccessKey", "iam/VirtualMFADevice", "iam/ServerCertificate", "iam/OIDCProvider", "iam/ManagedPolicy"]
    why: "Federation into the account is what a platform team wires first after roles and policies: `OpenIDConnectProvider` is covered (EKS IRSA), `SAMLProvider` is not and ACK ignores it. The rest of IAM that a platform team uses (roles, policies, boundaries through `Role.permissionsBoundary`, instance profiles, service-linked roles, users, groups, OIDC) is covered by ACK; ours already adds `RolePolicyAttachment`, `UserGroupMembership`, `LoginProfile`, `SSHPublicKey`, `AccountAlias` and `AccountPasswordPolicy`."
    kinds: |
      `iam.aws.hfl.dev/SAMLProvider`, generated: `CreateSAMLProvider`, `GetSAMLProvider`, `UpdateSAMLProvider`, `DeleteSAMLProvider`; `name` (immutable), `samlMetadataDocument` (the XML, read from a Secret or inline), `assertionEncryptionMode`, `addPrivateKey`/`removePrivateKey`, `tags`. The ARN is the identifier.
      `AccessKey`: recommend NOT building. The secret is returned once on create; a kind needs a Kubernetes Secret write-back and the key is a long-lived credential (community #1879 asks for it). If the builder wants it, hand-write it on the `LoginProfile` pattern (which already writes a password) and add the Secret write-back in the same change.
      `VirtualMFADevice` and `ServerCertificate`: low priority (a person's device; a legacy resource).
    upstream: "ACK `iam-controller` v1.11.3 ignores `SAMLProvider`, `AccessKey`, `VirtualMFADevice`, `ServiceSpecificCredential`, `PolicyVersion`, `LoginProfile`, `AccountAlias`. No PR for `SAMLProvider`. PR #167 (group membership, open) and #184 (`RolePolicyAttachment`, open) are already tracked in `UPSTREAM.md`."
    moto: "Good: `CreateSAMLProvider`, `CreateAccessKey`, `CreateVirtualMFADevice` are implemented."
    modules: "`iam` (#1, ranked first by downloads): `iam-user` (access key, login profile, SSH key), `iam-account` (alias, password policy; both ours already). SAML providers are in no tracked module."
    size: "S (SAMLProvider), M (AccessKey if wanted)"
    approach: "Add `SAMLProvider` to the generated-kind setup of `services/iam/` (`generator.yaml`, which already ignores what ACK has). The SAML metadata is a document: take it from `samlMetadataSecretRef` so it is not in the spec."
    done: "`SAMLProvider` passes an end-to-end test on moto (create, update metadata, delete, retain); README and `docs/plan.md` updated; `task coverage` moves `iam/SAMLProvider` to 100%."

  - id: F04
    title: "EC2 networking: Transit Gateway route tables, associations, propagation, routes and peering"
    resources: ["ec2/TransitGatewayRouteTable", "ec2/TransitGatewayRouteTableAssociation", "ec2/TransitGatewayRouteTablePropagation", "ec2/TransitGatewayRoute", "ec2/TransitGatewayPeeringAttachment", "ec2/TransitGateway", "ec2/TransitGatewayVpcAttachment"]
    why: "A Transit Gateway is how a platform team joins VPCs and accounts. ACK has `TransitGateway` and the VPC attachment only; without route tables a gateway routes everything through its default table. Its generator also ignores `ModifyTransitGateway`, so a gateway's options cannot change after create."
    kinds: |
      In `ec2.aws.hfl.dev`: `TransitGatewayRouteTable`, generated from `CreateTransitGatewayRouteTable`/`DescribeTransitGatewayRouteTables`/`DeleteTransitGatewayRouteTable`, with `associations[]` (attachment refs, `AssociateTransitGatewayRouteTable`), `propagations[]` (`EnableTransitGatewayRouteTablePropagation`) and `routes[]` (`CreateTransitGatewayRoute`, static or blackhole) as fields, the way ACK's `RouteTable` carries routes (see its route handling in ec2-controller `pkg/resource/route_table/hooks.go`). `TransitGatewayPeeringAttachment`, generated, with the peer account's accept step as a field.
      Then ask ACK for `ModifyTransitGateway`: four `TransitGateway` attributes are uncovered (`AssociationDefaultRouteTableId` and `PropagationDefaultRouteTableId`, which only make sense once route tables are kinds, `EncryptionSupport` and `SecurityGroupReferencingSupport`).
    upstream: "`ec2-controller` v1.23.1 ignores `TransitGatewayRouteTable`, `TransitGatewayRoute`, `TransitGatewayPeeringAttachment`, `TransitGatewayConnect`, `TransitGatewayConnectPeer` and the operation `ModifyTransitGateway`. No open PR or issue for them (#1865 `TransitGatewayAttachment` is closed). Recheck before starting."
    moto: "Good: `CreateTransitGateway`, `CreateTransitGatewayVpcAttachment`, `CreateTransitGatewayRouteTable`, `AssociateTransitGatewayRouteTable`, `EnableTransitGatewayRouteTablePropagation`, `CreateTransitGatewayRoute` and `CreateTransitGatewayPeeringAttachment` are implemented."
    modules: "`transit-gateway` (#32): gateway, route tables, VPC attachments, routes, RAM share; `vpn-gateway` (#30) attaches to a gateway; `vpc` (#3) can attach to one."
    size: "M, M"
    approach: "Add the kinds to `services/ec2/` (it has the EC2 SDK client at ACK's version and our patch 0002). Start from the generator entries and hook templates of ACK's `TransitGateway` and `RouteTable` at ec2-controller `9303654c`; record each copied file in `UPSTREAM.md`. `transitGatewayRef` and `attachmentRef` should resolve to ACK's `TransitGateway` and `TransitGatewayVPCAttachment`; plan section 8, point 10 describes the limit on kinds that reference ACK's own kinds of the same service (the generator rewrites ACK's import path): read it first."
    done: "End-to-end tests on moto for a gateway with two VPC attachments, a route table, an association, a propagation and a blackhole route, then deletion in dependency order; `task check`; `task coverage` moves `ec2/TransitGatewayRouteTable` to 100%."

  - id: F05
    title: "EC2 networking: site-to-site VPN connections and route propagation"
    resources: ["ec2/VPNConnection", "ec2/VPNConnectionRoute", "ec2/VPNGatewayRoutePropagation", "ec2/VPNGateway", "ec2/CustomerGateway"]
    why: "Hybrid connectivity: a customer gateway and a VPN gateway (ours already) mean nothing without the connection that joins them. ACK has none of the three; community #1868 has asked since 2023."
    kinds: |
      `ec2.aws.hfl.dev/VPNConnection`, generated from `CreateVpnConnection`/`DescribeVpnConnections`/`DeleteVpnConnection`: `type`, `customerGatewayRef` and `vpnGatewayRef` (our kinds) or `transitGatewayRef` (ACK's), `staticRoutesOnly`, `tunnelOptions[]` (two tunnels: pre-shared key from a Secret, CIDRs, IKE and phase lifetimes), `staticRoutes[]` (a field, `CreateVpnConnectionRoute`), tags. 43 CloudFormation attributes: the largest EC2 networking kind. Route propagation to a route table is a field of `RouteTable` upstream (`EnableVgwRoutePropagation`) or a small sidecar kind of ours.
