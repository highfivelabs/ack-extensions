    resources: ["cloudtrail/Trail", "cloudtrail/EventDataStore", "cloudtrail/ResourcePolicy", "cloudtrail/Channel", "cloudtrail/Dashboard"]
    why: "Audit logging is the first thing a security team checks. ACK's `Trail` covers 13 of 31 attributes including `isOrganizationTrail`, `isMultiRegionTrail`, the bucket, KMS key and log file validation, but a Trail it creates is never told to `StartLogging` (no `isLogging` field, and the controller's hooks make no such call) and has no event, advanced event or insight selectors. An organization trail is only useful once it logs."
    kinds: |
      A sidecar kind `cloudtrail.aws.hfl.dev/TrailLogging` that references an ACK `Trail` by `trailRef` or `trailARN`: `isLogging`, `eventSelectors[]`, `advancedEventSelectors[]`, `insightSelectors[]`, calling `StartLogging`/`StopLogging`, `PutEventSelectors`, `PutAdvancedEventSelectors`, `PutInsightSelectors`. Hand-written on the `RolePolicyAttachment` skeleton. The alternative is to add the fields to ACK's `Trail` upstream (plan section 9, question 1: wait for the release unless a package cannot work without the field; a trail that does not log cannot work, so this meets the rule). `ResourcePolicy`, `Channel`, `Dashboard`: low priority.
    upstream: "cloudtrail-controller v1.9.1; no open PRs or issues found. Its generator ignores `Channel` and `Dashboard`, and `EventDataStore` `KmsKeyId`, `BillingMode` and `StartIngestion`."
    moto: "Good for the first three: `StartLogging`, `StopLogging`, `PutEventSelectors`, `GetEventSelectors`, `PutInsightSelectors`, `GetTrailStatus` are implemented. `PutAdvancedEventSelectors` is not in moto's coverage list, and event data stores and channels are not implemented."
    modules: "None of the 40 tracked modules creates a Trail."
    size: "M"
    approach: "New `services/cloudtrail/` manager (there is none yet). Read ACK's `Trail` hook (`pkg/resource/trail/hooks.go` at cloudtrail-controller v1.9.1) to see its tag and update handling before you write."
    done: "An end-to-end test creates an ACK `Trail` and a `TrailLogging` that starts logging with one event selector, flips `isLogging` off and on, and deletes; the advanced-selector call is documented as unproved; `task coverage` moves `cloudtrail/Trail` above 70%."

