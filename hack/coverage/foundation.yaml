  "ec2/Route": {inline: "ACK `RouteTable.spec.routes[]` (14 route fields)", kinds: "none (inline)"}
  "ec2/NetworkAclEntry": {inline: "ACK `NetworkACL.spec.entries[]`", kinds: "none (inline)"}
  "ec2/SubnetNetworkAclAssociation": {inline: "ACK `NetworkACL.spec.associations[]`", kinds: "none (inline)"}
  "ec2/SubnetRouteTableAssociation": {inline: "ACK `Subnet.spec.routeTables[]` and `routeTableRefs`", kinds: "none (inline)"}
  "ec2/SecurityGroupIngress": {inline: "ACK `SecurityGroup.spec.ingressRules[]`", kinds: "none (inline); a standalone rule kind is a design question (catalog gap 6)"}
