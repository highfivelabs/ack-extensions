# Hand-kept parts of the match (see docs/coverage/README.md, "Matching").
# Everything not listed here is matched by name by the generator.

# ACK service id (or the service in one of our API groups) -> the
# CloudFormation service name, lower case, where they differ.
services:
  acm: certificatemanager
  bedrockagent: bedrock
  bedrockagentcorecontrol: bedrockagentcore
  cloudwatchlogs: logs
  cognitoidentityprovider: cognito
  documentdb: docdb
  ecrpublic: ecr
  elasticsearchservice: elasticsearch
  elbv2: elasticloadbalancingv2
  eventbridge: events
  firehose: kinesisfirehose
  kafka: msk
  keyspaces: cassandra
  mq: amazonmq
  prometheusservice: aps
  recyclebin: rbin
  s3control: s3
  sfn: stepfunctions

# Official kinds whose name differs from the CloudFormation resource's, or
# that have none. "<ack service id>/<Kind>": "<cfn service>/<Resource>" or
# outside-denominator.
resources:
  apigateway/APIIntegrationResponse: outside-denominator   # a property of AWS::ApiGateway::Method (Integration.IntegrationResponses)
  apigateway/APIMethodResponse: outside-denominator        # a property of AWS::ApiGateway::Method (MethodResponses)
  apigateway/Integration: outside-denominator              # a property of AWS::ApiGateway::Method (Integration)
  bedrock/InferenceProfile: outside-denominator
  bedrockagentcorecontrol/AgentRuntime: bedrockagentcore/Runtime
  bedrockagentcorecontrol/AgentRuntimeEndpoint: bedrockagentcore/RuntimeEndpoint
  bedrockagentcorecontrol/Browser: bedrockagentcore/BrowserCustom
  bedrockagentcorecontrol/CodeInterpreter: bedrockagentcore/CodeInterpreterCustom
  cloudwatch/MetricAlarm: cloudwatch/Alarm
  cloudwatchlogs/DeliveryDestinationPolicy: outside-denominator   # a property of AWS::Logs::DeliveryDestination
  cognitoidentityprovider/ResourceServer: cognito/UserPoolResourceServer
  dynamodb/Backup: outside-denominator
  ec2/ElasticIPAddress: ec2/EIP
  ec2/ManagedPrefixList: ec2/PrefixList
  ec2/VPCEndpointServiceConfiguration: ec2/VPCEndpointService
  ecrpublic/Repository: ecr/PublicRepository
  elasticache/CacheParameterGroup: elasticache/ParameterGroup
  elasticache/CacheSubnetGroup: elasticache/SubnetGroup
  elasticsearchservice/ElasticsearchDomain: elasticsearch/Domain
  elbv2/Rule: elasticloadbalancingv2/ListenerRule
  emrcontainers/JobRun: outside-denominator
  iam/OpenIDConnectProvider: iam/OIDCProvider
  iam/Policy: iam/ManagedPolicy                            # ACK's Policy is a managed policy
  kms/Grant: outside-denominator
  lambda/FunctionURLConfig: lambda/Url
  lambdamicrovms/Microvm: outside-denominator
  lambdamicrovms/MicrovmImage: outside-denominator
  opensearchservice/VPCEndpoint: outside-denominator
  opensearchservice/VPCEndpointAccess: outside-denominator
  prometheusservice/AlertManagerDefinition: outside-denominator   # a property of AWS::APS::Workspace
  prometheusservice/LoggingConfiguration: outside-denominator     # a property of AWS::APS::Workspace
  rds/DBClusterSnapshot: outside-denominator
  route53resolver/ResolverQueryLogConfig: route53resolver/ResolverQueryLoggingConfig
  route53resolver/ResolverQueryLogConfigAssociation: route53resolver/ResolverQueryLoggingConfigAssociation
  sagemaker/HyperParameterTuningJob: outside-denominator   # one-shot jobs have no CloudFormation resource
  sagemaker/LabelingJob: outside-denominator
  sagemaker/PipelineExecution: outside-denominator
  sagemaker/TrainingJob: outside-denominator
  sagemaker/TransformJob: outside-denominator
  sns/PlatformApplication: outside-denominator
  sns/PlatformEndpoint: outside-denominator

# Our kinds, "<group service>/<Kind>".
ours:
  # The scheduled actions of a scalable target: the ScheduledActions property of
  # AWS::ApplicationAutoScaling::ScalableTarget.
  applicationautoscaling/ScheduledAction: [applicationautoscaling/ScalableTarget]
  # A user's console password: the LoginProfile property of AWS::IAM::User.
  iam/LoginProfile: [iam/User]
  # A user's groups: the Groups property of AWS::IAM::User.
  iam/UserGroupMembership: [iam/User]
  # A role's managed policies: the ManagedPolicyArns property of AWS::IAM::Role.
  iam/RolePolicyAttachment: [iam/Role]
  # AWS::RDS::DBProxyTargetGroup registers instances and clusters with a proxy.
  rds/DBProxyTarget: [rds/DBProxyTargetGroup]
  # The AssociatedRoles property of AWS::RDS::DBCluster and AWS::RDS::DBInstance.
  rds/DBRoleAssociation: [rds/DBCluster, rds/DBInstance]

# Our kinds whose coverage is copied from an open ACK pull request.
fromUpstreamPR:
  iam/RolePolicyAttachment: iam-controller#184
  rds/OptionGroup: rds-controller#257
  kms/ReplicaKey: kms-controller#112
  ecr/ReplicationConfiguration: ecr-controller#121

# Path-prefix renames, official kinds: CRD spec path -> CloudFormation path.
attributes:
  s3/Bucket:
    acl: AccessControl
    abac.status: AbacStatus
    accelerate: AccelerateConfiguration
    accelerate.status: AccelerateConfiguration.AccelerationStatus
    analytics[]: AnalyticsConfigurations[]
    analytics[].filter.prefix: AnalyticsConfigurations[].Prefix
    analytics[].filter.tag: AnalyticsConfigurations[].TagFilters[]
    cors.corsRules[]: CorsConfiguration.CorsRules[]
    cors.corsRules[].exposeHeaders[]: CorsConfiguration.CorsRules[].ExposedHeaders[]
    cors.corsRules[].maxAgeSeconds: CorsConfiguration.CorsRules[].MaxAge
    encryption.rules[]: BucketEncryption.ServerSideEncryptionConfiguration[]
    encryption.rules[].applyServerSideEncryptionByDefault: BucketEncryption.ServerSideEncryptionConfiguration[].ServerSideEncryptionByDefault
    encryption.rules[].applyServerSideEncryptionByDefault.sseAlgorithm: BucketEncryption.ServerSideEncryptionConfiguration[].ServerSideEncryptionByDefault.SSEAlgorithm
    intelligentTiering[]: IntelligentTieringConfigurations[]
    intelligentTiering[].filter.prefix: IntelligentTieringConfigurations[].Prefix
    intelligentTiering[].filter.tag: IntelligentTieringConfigurations[].TagFilters[]
    inventory[]: InventoryConfigurations[]
    inventory[].destination.s3BucketDestination: InventoryConfigurations[].Destination
    inventory[].destination.s3BucketDestination.bucket: InventoryConfigurations[].Destination.BucketArn
    inventory[].destination.s3BucketDestination.accountID: InventoryConfigurations[].Destination.BucketAccountId
    inventory[].filter.prefix: InventoryConfigurations[].Prefix
    inventory[].isEnabled: InventoryConfigurations[].Enabled
    inventory[].schedule.frequency: InventoryConfigurations[].ScheduleFrequency
    lifecycle: LifecycleConfiguration
    lifecycle.rules[].filter.prefix: LifecycleConfiguration.Rules[].Prefix
    lifecycle.rules[].filter.objectSizeGreaterThan: LifecycleConfiguration.Rules[].ObjectSizeGreaterThan
    lifecycle.rules[].filter.objectSizeLessThan: LifecycleConfiguration.Rules[].ObjectSizeLessThan
    lifecycle.rules[].filter.tag: LifecycleConfiguration.Rules[].TagFilters[]
    lifecycle.rules[].expiration.days: LifecycleConfiguration.Rules[].ExpirationInDays
    lifecycle.rules[].expiration.date: LifecycleConfiguration.Rules[].ExpirationDate
    lifecycle.rules[].transitions[].days: LifecycleConfiguration.Rules[].Transitions[].TransitionInDays
    lifecycle.rules[].transitions[].date: LifecycleConfiguration.Rules[].Transitions[].TransitionDate
    lifecycle.rules[].noncurrentVersionTransitions[].noncurrentDays: LifecycleConfiguration.Rules[].NoncurrentVersionTransitions[].TransitionInDays
    logging.loggingEnabled: LoggingConfiguration
    logging.loggingEnabled.targetBucket: LoggingConfiguration.DestinationBucketName
    logging.loggingEnabled.targetPrefix: LoggingConfiguration.LogFilePrefix
    metrics[]: MetricsConfigurations[]
    metrics[].filter.prefix: MetricsConfigurations[].Prefix
    metrics[].filter.tag: MetricsConfigurations[].TagFilters[]
    notification.lambdaFunctionConfigurations[]: NotificationConfiguration.LambdaConfigurations[]
    notification.lambdaFunctionConfigurations[].events[]: NotificationConfiguration.LambdaConfigurations[].Event
    notification.lambdaFunctionConfigurations[].lambdaFunctionARN: NotificationConfiguration.LambdaConfigurations[].Function
    notification.queueConfigurations[]: NotificationConfiguration.QueueConfigurations[]
    notification.queueConfigurations[].events[]: NotificationConfiguration.QueueConfigurations[].Event
    notification.queueConfigurations[].queueARN: NotificationConfiguration.QueueConfigurations[].Queue
    notification.topicConfigurations[]: NotificationConfiguration.TopicConfigurations[]
    notification.topicConfigurations[].events[]: NotificationConfiguration.TopicConfigurations[].Event
    notification.topicConfigurations[].topicARN: NotificationConfiguration.TopicConfigurations[].Topic
    objectLockEnabled: ObjectLockEnabled
    objectLockConfiguration: ObjectLockConfiguration
    replication: ReplicationConfiguration
    replication.rules[].filter.tag: ReplicationConfiguration.Rules[].Filter.TagFilter
    replication.rules[].filter.and.tags[]: ReplicationConfiguration.Rules[].Filter.And.TagFilters[]
    tagging.tagSet[]: Tags[]
    versioning: VersioningConfiguration
    website: WebsiteConfiguration
    website.indexDocument.suffix: WebsiteConfiguration.IndexDocument
    website.errorDocument.key: WebsiteConfiguration.ErrorDocument
  ec2/SecurityGroup:
    ingressRules[]: SecurityGroupIngress[]
    ingressRules[].ipRanges[].cidrIP: SecurityGroupIngress[].CidrIp
    ingressRules[].ipRanges[].description: SecurityGroupIngress[].Description
    ingressRules[].ipv6Ranges[].cidrIPv6: SecurityGroupIngress[].CidrIpv6
    ingressRules[].prefixListIDs[].prefixListID: SecurityGroupIngress[].SourcePrefixListId
    ingressRules[].userIDGroupPairs[].groupID: SecurityGroupIngress[].SourceSecurityGroupId
    ingressRules[].userIDGroupPairs[].groupName: SecurityGroupIngress[].SourceSecurityGroupName
    ingressRules[].userIDGroupPairs[].userID: SecurityGroupIngress[].SourceSecurityGroupOwnerId
    egressRules[]: SecurityGroupEgress[]
    egressRules[].ipRanges[].cidrIP: SecurityGroupEgress[].CidrIp
    egressRules[].ipRanges[].description: SecurityGroupEgress[].Description
    egressRules[].ipv6Ranges[].cidrIPv6: SecurityGroupEgress[].CidrIpv6
    egressRules[].prefixListIDs[].prefixListID: SecurityGroupEgress[].DestinationPrefixListId
    egressRules[].userIDGroupPairs[].groupID: SecurityGroupEgress[].DestinationSecurityGroupId
  ec2/VPC:
    cidrBlocks[]: CidrBlock
  athena/WorkGroup:
    configuration: WorkGroupConfiguration
  iam/Role:
    policies[]: ManagedPolicyArns[]
    inlinePolicies{}: Policies[].PolicyDocument
  iam/OpenIDConnectProvider:
    clientIDs[]: ClientIdList[]
    thumbprints[]: ThumbprintList[]
  route53/RecordSet:
    resourceRecords[].value: ResourceRecords[]
  iam/User:
    policies[]: ManagedPolicyArns[]
    inlinePolicies{}: Policies[].PolicyDocument
  iam/Group:
    policies[]: ManagedPolicyArns[]
    inlinePolicies{}: Policies[].PolicyDocument
  ecr/Repository:
    lifecyclePolicy: LifecyclePolicy.LifecyclePolicyText
    policy: RepositoryPolicyText
    imageTagMutabilityExclusionFilters[].filter: ImageTagMutabilityExclusionFilters[].ImageTagMutabilityExclusionFilterValue
  ecr/RepositoryCreationTemplate:
    imageTagMutabilityExclusionFilters[].filter: ImageTagMutabilityExclusionFilters[].ImageTagMutabilityExclusionFilterValue

# The same for our kinds.
oursAttributes:
  applicationautoscaling/ScheduledAction:
    scheduledActionName: ScheduledActions[].ScheduledActionName
    schedule: ScheduledActions[].Schedule
    timezone: ScheduledActions[].Timezone
    startTime: ScheduledActions[].StartTime
    endTime: ScheduledActions[].EndTime
    scalableTargetAction: ScheduledActions[].ScalableTargetAction
  iam/LoginProfile:
    password: LoginProfile.Password
    passwordResetRequired: LoginProfile.PasswordResetRequired
  iam/UserGroupMembership:
    groups[]: Groups[]
  iam/RolePolicyAttachment:
    policyARN: ManagedPolicyArns[]
  rds/DBProxyTarget:
    dbInstanceIdentifier: DBInstanceIdentifiers[]
    dbClusterIdentifier: DBClusterIdentifiers[]
  rds/DBRoleAssociation:
    roleARN: AssociatedRoles[].RoleArn
    featureName: AssociatedRoles[].FeatureName
  ec2/VolumeAttachment:
    deviceName: Device
  kms/ReplicaKey:
    keyID: PrimaryKeyArn
    policy: KeyPolicy
    tags[].tagKey: Tags[].Key
    tags[].tagValue: Tags[].Value
  rds/OptionGroup:
    name: OptionGroupName
    description: OptionGroupDescription

# Notes for resource rows, "<cfn service>/<Resource>".
notes: {}

# Terraform resource types (the AWS modules in module-usage.csv) that the
# generator cannot pair with a CloudFormation resource by name, to the resource
# they create or configure, or outside-denominator. Used only for the "modules"
# column of docs/coverage/foundation.md.
terraform:
  aws_acm_certificate: [certificatemanager/Certificate]
  aws_default_network_acl: [ec2/NetworkAcl]
  aws_default_route_table: [ec2/RouteTable]
  aws_default_security_group: [ec2/SecurityGroup]
  aws_default_vpc: [ec2/VPC]
  aws_ec2_tag: [outside-denominator]
  aws_ecr_lifecycle_policy: [ecr/Repository]
  aws_ecr_repository_policy: [ecr/Repository]
  aws_ecrpublic_repository_policy: [ecr/PublicRepository]
  aws_eks_access_policy_association: [eks/AccessEntry]
  aws_iam_account_alias: [outside-denominator]
  aws_iam_account_password_policy: [outside-denominator]
  aws_iam_group_membership: [iam/UserToGroupAddition]
  aws_iam_group_policy_attachment: [iam/Group]
  aws_iam_openid_connect_provider: [iam/OIDCProvider]
  aws_iam_policy_attachment: [iam/ManagedPolicy]
  aws_iam_role_policy_attachment: [iam/Role]
  aws_iam_user_login_profile: [iam/User]
  aws_iam_user_policy_attachment: [iam/User]
  aws_iam_user_ssh_key: [outside-denominator]
  aws_kms_external_key: [kms/Key]
  aws_kms_grant: [outside-denominator]
  aws_kms_replica_external_key: [kms/ReplicaKey]
  aws_network_acl_rule: [ec2/NetworkAclEntry]
  aws_ram_resource_share_accepter: [outside-denominator]
  aws_route53_hosted_zone_dnssec: [route53/DNSSEC]
  aws_route53_record: [route53/RecordSet]
  aws_route53_resolver_endpoint: [route53resolver/ResolverEndpoint]
  aws_route53_resolver_firewall_rule: [route53resolver/FirewallRuleGroup]
  aws_route53_resolver_rule: [route53resolver/ResolverRule]
  aws_route53_resolver_rule_association: [route53resolver/ResolverRuleAssociation]
  aws_route53_vpc_association_authorization: [outside-denominator]
  aws_route53_zone: [route53/HostedZone]
  aws_route_table_association: [ec2/SubnetRouteTableAssociation]
  aws_secretsmanager_secret_policy: [secretsmanager/ResourcePolicy]
  aws_secretsmanager_secret_rotation: [secretsmanager/RotationSchedule]
  aws_secretsmanager_secret_version: [secretsmanager/Secret]
  aws_security_group_rule: [ec2/SecurityGroupIngress, ec2/SecurityGroupEgress]
  aws_vpc_ipv4_cidr_block_association: [ec2/VPCCidrBlock]
  aws_vpc_security_group_egress_rule: [ec2/SecurityGroupEgress]
  aws_vpc_security_group_ingress_rule: [ec2/SecurityGroupIngress]
  aws_vpn_gateway_attachment: [ec2/VPCGatewayAttachment]
