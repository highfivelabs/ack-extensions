# Generator configuration for ack-extensions's EC2 kinds (ec2.aws.hfl.dev).
#
# ACK's ec2-controller (v1.23.1) ignores CustomerGateway, VpnGateway and
# Volume.
# They are generated
# here with that controller's own patterns for an EC2 resource: tags
# passed as TagSpecifications on create and synced with CreateTags and
# DeleteTags after (copied from its InternetGateway and pkg/tags), and
# readiness on the resource's state. Every other resource the generator
# finds in the EC2 model is ignored: ACK has it, or it is not built here.
operations:
  # LaunchTemplate, a fixed copy of ACK's (below).
  CreateLaunchTemplate:
    operation_type:
      - Create
    output_wrapper_field_path: LaunchTemplate
    resource_name: LaunchTemplate
  CreateLaunchTemplateVersion:
    operation_type:
      - Update
    output_wrapper_field_path: LaunchTemplateVersion
    resource_name: LaunchTemplate
  DescribeLaunchTemplates:
    custom_check_required_fields_missing_method: checkForMissingRequiredFields
  CreateCustomerGateway:
    output_wrapper_field_path: CustomerGateway
  # KeyPair, from ec2-controller pull request #396 (head 91d99b7a): made by
  # ImportKeyPair, so the private key never leaves its owner.
  ImportKeyPair:
    operation_type:
      - Create
    resource_name: KeyPair
  DescribeKeyPairs:
    custom_check_required_fields_missing_method: checkForMissingRequiredFields
  CreateVpnGateway:
    output_wrapper_field_path: VpnGateway
  CreateVpnConnection:
    output_wrapper_field_path: VpnConnection
  CreateNetworkInterfacePermission:
    output_wrapper_field_path: InterfacePermission
  # A VPN gateway's routes propagated into a route table: an attach pair,
  # read from the table's propagating gateways (the PolicyAttachment
  # pattern, organizations/generator.yaml).
  EnableVgwRoutePropagation:
    operation_type: Create
    resource_name: VpnGatewayRoutePropagation
  DisableVgwRoutePropagation:
    operation_type: Delete
    resource_name: VpnGatewayRoutePropagation
  DescribeRouteTables:
    operation_type: List
    resource_name: VpnGatewayRoutePropagation
resources:
  # LaunchTemplate: a fixed copy of ACK's (docs/plan.md section 3, "Fixed
  # copies of ACK's kinds"; section 6.43): ec2-controller v1.23.1's entry,
  # with the references of its pull request #364 added (the catalog's eks
  # chart refused custom launch templates for want of securityGroupRefs,
  # krm-packages PR #237).
  LaunchTemplate:
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/launch_template/sdk_create_post_build_request.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/launch_template/sdk_update_pre_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/launch_template/sdk_read_many_post_set_output.go.tpl
      sdk_file_end:
        template_path: hooks/launch_template/sdk_file_end.go.tpl
    exceptions:
      errors:
        404:
          code: InvalidLaunchTemplateName.NotFoundException
    renames:
      operations:
        CreateLaunchTemplate:
          input_fields:
            LaunchTemplateName: Name
            LaunchTemplateData: Data
          output_fields:
            LaunchTemplateId: ID
            # Note: maybe we can rename this to just version?
            # thoughts...
            DefaultVersionNumber: DefaultVersion
            LatestVersionNumber: LatestVersion
        CreateLaunchTemplateVersion:
          input_fields:
            LaunchTemplateId: ID
            LaunchTemplateData: Data
          output_fields:
            LaunchTemplateData: Data
            LaunchTemplateId: ID
            VersionNumber: LatestVersion
        DeleteLaunchTemplate:
          input_fields:
            LaunchTemplateId: ID
        DescribeLaunchTemplates:
          input_fields:
            LaunchTemplateIds: ID
          output_fields:
            LatestVersionNumber: LatestVersion
            DefaultVersionNumber: DefaultVersion
    fields:
      ID:
        is_primary_key: true
        print:
          name: ID
      Tags:
        from:
          operation: CreateTags
          path: Tags
      DefaultVersion:
        from:
          operation: ModifyLaunchTemplate
          path: LaunchTemplate.DefaultVersionNumber
      Data.ElasticInferenceAccelerators.Type:
        go_tag: json:"type,omitempty"
      Data.ElasticGPUSpecifications.Type:
        go_tag: json:"type,omitempty"
      # ec2-controller pull request #364 (closed unmerged, head ad464975),
      # copied: references under Data, and Data not written back by the
      # update (its response carries no *Ref fields; hooks.go's
      # preserveDataReferenceFields keeps them on the read).
      Data:
        set:
          - method: Update
            ignore: true
      Data.SecurityGroupIds:
        references:
          resource: SecurityGroup
          path: Status.ID
      Data.NetworkInterfaces.SubnetId:
        references:
          resource: Subnet
          path: Status.SubnetID
      Data.BlockDeviceMappings.Ebs.KmsKeyId:
        references:
          service_name: kms
          resource: Key
          path: Status.ACKResourceMetadata.ARN
  # KeyPair: ec2-controller pull request #396's entry (head 91d99b7a),
  # copied unchanged (docs/plan.md section 6.50).
  KeyPair:
    exceptions:
      errors:
        404:
          code: InvalidKeyPair.NotFound
      terminal_codes:
      - InvalidKeyPair.Duplicate
      - InvalidKey.Format
      - InvalidParameterCombination
      - InvalidParameterValue
      - MissingParameter
    fields:
      KeyName:
        is_primary_key: true
        is_immutable: true
      # ImportKeyPair takes the public key as a blob; the spec carries the
      # public key text and the create hook converts it.
      # ImportKeyPair needs it, but DescribeKeyPairs never returns it, so an
      # adopted KeyPair has no value to write back; the create hook rejects a
      # missing key the way MinCount and MaxCount are handled on Instance.
      PublicKeyMaterial:
        is_required: false
        is_immutable: true
        type: string
        set:
          - ignore: "all"
      KeyPairId:
        print:
          name: ID
      Tags:
        from:
          operation: CreateTags
          path: Tags
    list_operation:
      match_fields:
      - KeyName
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/key_pair/sdk_create_post_build_request.go.tpl
      sdk_read_many_post_build_request:
        template_path: hooks/key_pair/sdk_read_many_post_build_request.go.tpl
    update_operation:
      custom_method_name: customUpdateKeyPair
  CustomerGateway:
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      CustomerGatewayID:
        print:
          name: ID
      BGPASN:
        is_immutable: true
        # The input takes a number, CustomerGateway (output) a string: the
        # spec keeps what was written (the field is immutable).
        set:
          - ignore: "from"
      BGPASNExtended:
        is_immutable: true
        # The input takes a number, CustomerGateway (output) a string: the
        # spec keeps what was written (the field is immutable).
        set:
          - ignore: "from"
      CertificateARN:
        is_immutable: true
      DeviceName:
        is_immutable: true
      IPAddress:
        is_immutable: true
      Type:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/customer_gateway/sdk_create_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/customer_gateway/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateCustomerGateway
    synced:
      when:
        - path: Status.State
          in:
            - available
  VpnGateway:
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      # The VPC the gateway is attached to (AttachVpnGateway), as ACK's
      # InternetGateway models its VPC.
      VPC:
        from:
          operation: AttachVpnGateway
          path: VpcId
        # vpcRef: ACK's VPC (ec2.services.k8s.aws), aliased in
        # apis/v1alpha1/ack_kinds.go (open question 16, answered).
        references:
          resource: VPC
          path: Status.VPCID
      VPNGatewayID:
        print:
          name: ID
      AmazonSideASN:
        is_immutable: true
      AvailabilityZone:
        is_immutable: true
      Type:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/vpn_gateway/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/vpn_gateway/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/vpn_gateway/sdk_read_many_post_set_output.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/vpn_gateway/sdk_delete_pre_build_request.go.tpl
    update_operation:
      custom_method_name: customUpdateVpnGateway
    synced:
      when:
        - path: Status.State
          in:
            - available
  # A site-to-site VPN connection between our CustomerGateway and our
  # VPNGateway (or a transit gateway, by ID). The tunnels' pre-shared keys
  # come from Secrets; the options are what the spec says (EC2 returns them
  # in another shape, and with the keys in them, so the read never copies
  # them back); the device configuration EC2 returns holds the keys and is
  # never kept. Updates: tags, static routes and tunnel options
  # (hooks.go); everything else is immutable.
  VpnConnection:
    exceptions:
      errors:
        404:
          code: InvalidVpnConnectionID.NotFound
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      VPNConnectionID:
        print:
          name: ID
      CustomerGatewayID:
        is_required: true
        is_immutable: true
        references:
          resource: CustomerGateway
          path: Status.CustomerGatewayID
      VPNGatewayID:
        is_immutable: true
        references:
          resource: VPNGateway
          path: Status.VPNGatewayID
      TransitGatewayID:
        is_immutable: true
        # transitGatewayRef: ACK's TransitGateway (ec2.services.k8s.aws),
        # aliased in apis/v1alpha1/ack_kinds.go (open question 16, answered).
        references:
          resource: TransitGateway
          path: Status.TransitGatewayID
      Type:
        is_required: true
        is_immutable: true
      Options:
        set:
          - ignore: "from"
      Options.TunnelOptions.PreSharedKey:
        is_secret: true
      # Static routes (CreateVpnConnectionRoute, DeleteVpnConnectionRoute),
      # for a connection with options.staticRoutesOnly; read back from the
      # connection's routes (hooks.go).
      StaticRoutes:
        type: "[]*string"
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/vpn_connection/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/vpn_connection/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_request:
        template_path: hooks/vpn_connection/sdk_read_many_post_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/vpn_connection/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateVpnConnection
    synced:
      when:
        - path: Status.State
          in:
            - available
  # Another account's (or an AWS service's) permission to attach to, or
  # request-manage, one of this account's network interfaces. Every field is
  # immutable; there is no update call. moto has none of the API.
  NetworkInterfacePermission:
    exceptions:
      errors:
        404:
          code: InvalidPermissionID.NotFound
    fields:
      NetworkInterfacePermissionID:
        is_primary_key: true
        print:
          name: ID
      NetworkInterfaceID:
        is_required: true
        is_immutable: true
      Permission:
        is_required: true
        is_immutable: true
      AWSAccountID:
        is_immutable: true
      AWSService:
        is_immutable: true
    hooks:
      sdk_read_many_post_set_output:
        template_path: hooks/network_interface_permission/sdk_read_many_post_set_output.go.tpl
    synced:
      when:
        - path: Status.PermissionState.State
          in:
            - granted
    tags:
      ignore: true
  # moto has none of EnableVgwRoutePropagation or
  # DisableVgwRoutePropagation: unproven on the fake.
  VpnGatewayRoutePropagation:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: InvalidRouteTableID.NotFound
    list_operation:
      match_fields:
        - RouteTableId
    fields:
      GatewayID:
        is_required: true
        is_immutable: true
        references:
          resource: VPNGateway
          path: Status.VPNGatewayID
      RouteTableID:
        is_primary_key: true
        is_required: true
        is_immutable: true
        # routeTableRef: ACK's RouteTable (ec2.services.k8s.aws), aliased in
        # apis/v1alpha1/ack_kinds.go (open question 16, answered).
        references:
          resource: RouteTable
          path: Status.RouteTableID
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/vpn_gateway_route_propagation/sdk_read_many_post_build_request.go.tpl
      sdk_read_many_post_request:
        template_path: hooks/vpn_gateway_route_propagation/sdk_read_many_post_request.go.tpl
  Volume:
    exceptions:
      errors:
        404:
          code: InvalidVolume.NotFound
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      VolumeID:
        print:
          name: ID
      AvailabilityZone:
        is_immutable: true
        # availabilityZoneRef: the Availability Zone of ACK's Instance
        # (ec2.services.k8s.aws; its read fills spec.placement from
        # DescribeInstances), so a volume is made beside the instance it is
        # for (the ec2-instance chart's ebs_volumes; open question 16).
        references:
          resource: Instance
          path: Spec.Placement.AvailabilityZone
      SnapshotID:
        is_immutable: true
      Encrypted:
        is_immutable: true
      KMSKeyID:
        is_immutable: true
      OutpostARN:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/volume/sdk_create_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/volume/sdk_read_many_post_set_output.go.tpl
      # EC2's defaults (type, IOPS, throughput, multi-attach, encryption)
      # are no drift (custom_delta.go, as ACK applicationautoscaling-
      # controller's ScalableTarget does).
      delta_pre_compare:
        code: customSetDefaults(a, b)
    # ModifyVolume changes the size, type, IOPS, throughput and
    # multi-attach; tags are synced as for the gateways.
    update_operation:
      custom_method_name: customUpdateVolume
    synced:
      when:
        - path: Status.State
          in:
            - available
            - in-use
ignore:
  operations:
    # KeyPair is created with ImportKeyPair; the private key stays outside
    # AWS (ec2-controller pull request #396).
    - CreateKeyPair
  shape_names:
    # The SDK's shapes named like ACK's ec2 kinds that our references name
    # (apis/v1alpha1/ack_kinds.go) would clash with the aliases; no field of
    # ours uses them.
    - Instance
    - RouteTable
    - SecurityGroup
    - Subnet
    - TransitGateway
    - Vpc
  field_paths:
    # LaunchTemplate (ACK's ignores, copied from ec2-controller v1.23.1).
    - CreateLaunchTemplateInput.DryRun
    - CreateLaunchTemplateInput.ClientToken
    - CreateLaunchTemplateInput.TagSpecifications
    - CreateLaunchTemplateVersionOutput.LaunchTemplateVersion.DefaultVersion
    # Deprecated: IpAddress replaces it (EC2 API reference).
    - CreateCustomerGatewayInput.PublicIp
    - CreateCustomerGatewayInput.DryRun
    # Tags are spec.tags (TagSpecifications built from them on create).
    - CreateCustomerGatewayInput.TagSpecifications
    - CreateVpnGatewayInput.DryRun
    - CreateVpnGatewayInput.TagSpecifications
    - CreateVolumeInput.DryRun
    - CreateVolumeInput.ClientToken
    - CreateVolumeInput.TagSpecifications
    - CreateVolumeInput.Operator
    - CreateNetworkInterfacePermissionInput.DryRun
    # KeyPair (ec2-controller pull request #396's ignores).
    - ImportKeyPairInput.DryRun
    - ImportKeyPairInput.TagSpecifications
    - DeleteKeyPairInput.DryRun
    - DeleteKeyPairInput.KeyPairId
    - EnableVgwRoutePropagationInput.DryRun
    - DisableVgwRoutePropagationInput.DryRun
    - DescribeRouteTablesInput.DryRun
    # The attachments are the VolumeAttachment kind's to report; ignoring
    # them also keeps the generator from emitting a VolumeAttachment type
    # that would clash with that kind.
    - Volume.Attachments
    - CreateVolumeOutput.Attachments
    - CreateVpnConnectionInput.DryRun
    - CreateVpnConnectionInput.TagSpecifications
    # Holds the tunnels' pre-shared keys in clear: never kept in the object.
    - CreateVpnConnectionOutput.VpnConnection.CustomerGatewayConfiguration
  resource_names:
    - CapacityManagerDataExport
    - CapacityReservation
    - CapacityReservationBySplitting
    - CapacityReservationFleet
    - CarrierGateway
    - ClientVpnEndpoint
    - ClientVpnRoute
    - CoipCidr
    - CoipPool
    - DefaultSubnet
    - DefaultVpc
    - DelegateMacVolumeOwnershipTask
    - EgressOnlyInternetGateway
    - Fleet
    - FpgaImage
    - Image
    - ImageUsageReport
    - InstanceConnectEndpoint
    - InstanceEventWindow
    - InstanceExportTask
    - InternetGateway
    - InterruptibleCapacityReservationAllocation
    - Ipam
    - IpamExternalResourceVerificationToken
    - IpamPolicy
    - IpamPool
    - IpamPrefixListResolver
    - IpamPrefixListResolverTarget
    - IpamResourceDiscovery
    - IpamScope
    - LaunchTemplateVersion
    - LocalGatewayRoute
    - LocalGatewayRouteTable
    - LocalGatewayRouteTableVirtualInterfaceGroupAssociation
    - LocalGatewayRouteTableVpcAssociation
    - LocalGatewayVirtualInterface
    - LocalGatewayVirtualInterfaceGroup
    - MacSystemIntegrityProtectionModificationTask
    - ManagedPrefixList
    - NatGateway
    - NetworkAcl
    - NetworkAclEntry
    - NetworkInsightsAccessScope
    - NetworkInsightsPath
    - NetworkInterface
    - PlacementGroup
    - PublicIpv4Pool
    - ReplaceRootVolumeTask
    - ReservedInstancesListing
    - RestoreImageTask
    - Route
    - RouteServer
    - RouteServerEndpoint
    - RouteServerPeer
    - RouteTable
    - SecondaryNetwork
    - SecondarySubnet
    - SecurityGroup
    - Snapshot
    - SpotDatafeedSubscription
    - StoreImageTask
    - Subnet
    - SubnetCidrReservation
    - TrafficMirrorFilter
    - TrafficMirrorFilterRule
    - TrafficMirrorSession
    - TrafficMirrorTarget
    - TransitGateway
    - TransitGatewayConnect
    - TransitGatewayConnectPeer
    - TransitGatewayMeteringPolicy
    - TransitGatewayMeteringPolicyEntry
    - TransitGatewayMulticastDomain
    - TransitGatewayPeeringAttachment
    - TransitGatewayPolicyTable
    - TransitGatewayPrefixListReference
    - TransitGatewayRoute
    - TransitGatewayRouteTable
    - TransitGatewayRouteTableAnnouncement
    - TransitGatewayVpcAttachment
    - VerifiedAccessEndpoint
    - VerifiedAccessGroup
    - VerifiedAccessInstance
    - VerifiedAccessTrustProvider
    - Vpc
    - VpcBlockPublicAccessExclusion
    - VpcEncryptionControl
    - VpcEndpoint
    - VpcEndpointConnectionNotification
    - VpcEndpointServiceConfiguration
    - VpcPeeringConnection
    - VpnConcentrator
    - VpnConnectionRoute
