# Generator configuration for ack-extensions's EC2 kinds (ec2.aws.hfl.dev).
#
# ACK's ec2-controller (v1.23.1) ignores CustomerGateway, VpnGateway and
# Volume.
# They are generated
# here with that controller's own patterns for an EC2 resource: tags
# passed as TagSpecifications on create and synced with CreateTags and
# DeleteTags after (copied from its InternetGateway and pkg/tags), and
# readiness on the resource's state. Every other resource the generator
# finds in the EC2 model is ignored: ACK has it, or it is not built here.
operations:
  CreateCustomerGateway:
    output_wrapper_field_path: CustomerGateway
  CreateVpnGateway:
    output_wrapper_field_path: VpnGateway
  CreateVpnConnection:
    output_wrapper_field_path: VpnConnection
  CreateNetworkInterfacePermission:
    output_wrapper_field_path: InterfacePermission
  # A VPN gateway's routes propagated into a route table: an attach pair,
  # read from the table's propagating gateways (the PolicyAttachment
  # pattern, organizations/generator.yaml).
  EnableVgwRoutePropagation:
    operation_type: Create
    resource_name: VpnGatewayRoutePropagation
  DisableVgwRoutePropagation:
    operation_type: Delete
    resource_name: VpnGatewayRoutePropagation
  DescribeRouteTables:
    operation_type: List
    resource_name: VpnGatewayRoutePropagation
resources:
  CustomerGateway:
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      CustomerGatewayID:
        print:
          name: ID
      BGPASN:
        is_immutable: true
        # The input takes a number, CustomerGateway (output) a string: the
        # spec keeps what was written (the field is immutable).
        set:
          - ignore: "from"
      BGPASNExtended:
        is_immutable: true
        # The input takes a number, CustomerGateway (output) a string: the
        # spec keeps what was written (the field is immutable).
        set:
          - ignore: "from"
      CertificateARN:
        is_immutable: true
      DeviceName:
        is_immutable: true
      IPAddress:
        is_immutable: true
      Type:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/customer_gateway/sdk_create_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/customer_gateway/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateCustomerGateway
    synced:
      when:
        - path: Status.State
          in:
            - available
  VpnGateway:
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      # The VPC the gateway is attached to (AttachVpnGateway), as ACK's
      # InternetGateway models its VPC.
      VPC:
        from:
          operation: AttachVpnGateway
          path: VpcId
      VPNGatewayID:
        print:
          name: ID
      AmazonSideASN:
        is_immutable: true
      AvailabilityZone:
        is_immutable: true
      Type:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/vpn_gateway/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/vpn_gateway/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/vpn_gateway/sdk_read_many_post_set_output.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/vpn_gateway/sdk_delete_pre_build_request.go.tpl
    update_operation:
      custom_method_name: customUpdateVpnGateway
    synced:
      when:
        - path: Status.State
          in:
            - available
  # A site-to-site VPN connection between our CustomerGateway and our
  # VPNGateway (or a transit gateway, by ID). The tunnels' pre-shared keys
  # come from Secrets; the options are what the spec says (EC2 returns them
  # in another shape, and with the keys in them, so the read never copies
  # them back); the device configuration EC2 returns holds the keys and is
  # never kept. Updates: tags, static routes and tunnel options
  # (hooks.go); everything else is immutable.
  VpnConnection:
    exceptions:
      errors:
        404:
          code: InvalidVpnConnectionID.NotFound
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      VPNConnectionID:
        print:
          name: ID
      CustomerGatewayID:
        is_required: true
        is_immutable: true
        references:
          resource: CustomerGateway
          path: Status.CustomerGatewayID
      VPNGatewayID:
        is_immutable: true
        references:
          resource: VPNGateway
          path: Status.VPNGatewayID
      TransitGatewayID:
        is_immutable: true
      Type:
        is_required: true
        is_immutable: true
      Options:
        set:
          - ignore: "from"
      Options.TunnelOptions.PreSharedKey:
        is_secret: true
      # Static routes (CreateVpnConnectionRoute, DeleteVpnConnectionRoute),
      # for a connection with options.staticRoutesOnly; read back from the
      # connection's routes (hooks.go).
      StaticRoutes:
        type: "[]*string"
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/vpn_connection/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/vpn_connection/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_request:
        template_path: hooks/vpn_connection/sdk_read_many_post_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/vpn_connection/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateVpnConnection
    synced:
      when:
        - path: Status.State
          in:
            - available
  # Another account's (or an AWS service's) permission to attach to, or
  # request-manage, one of this account's network interfaces. Every field is
  # immutable; there is no update call. moto has none of the API.
  NetworkInterfacePermission:
    exceptions:
      errors:
        404:
          code: InvalidPermissionID.NotFound
    fields:
      NetworkInterfacePermissionID:
        is_primary_key: true
        print:
          name: ID
      NetworkInterfaceID:
        is_required: true
        is_immutable: true
      Permission:
        is_required: true
        is_immutable: true
      AWSAccountID:
        is_immutable: true
      AWSService:
        is_immutable: true
    hooks:
      sdk_read_many_post_set_output:
        template_path: hooks/network_interface_permission/sdk_read_many_post_set_output.go.tpl
    synced:
      when:
        - path: Status.PermissionState.State
          in:
            - granted
    tags:
      ignore: true
  # moto has none of EnableVgwRoutePropagation or
  # DisableVgwRoutePropagation: unproven on the fake.
  VpnGatewayRoutePropagation:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: InvalidRouteTableID.NotFound
    list_operation:
      match_fields:
        - RouteTableId
    fields:
      GatewayID:
        is_required: true
        is_immutable: true
        references:
          resource: VPNGateway
          path: Status.VPNGatewayID
      RouteTableID:
        is_primary_key: true
        is_required: true
        is_immutable: true
    hooks:
      sdk_read_many_post_build_request:
        template_path: hooks/vpn_gateway_route_propagation/sdk_read_many_post_build_request.go.tpl
      sdk_read_many_post_request:
        template_path: hooks/vpn_gateway_route_propagation/sdk_read_many_post_request.go.tpl
  Volume:
    exceptions:
      errors:
        404:
          code: InvalidVolume.NotFound
    fields:
      Tags:
        from:
          operation: CreateTags
          path: Tags
      VolumeID:
        print:
          name: ID
      AvailabilityZone:
        is_immutable: true
      SnapshotID:
        is_immutable: true
      Encrypted:
        is_immutable: true
      KMSKeyID:
        is_immutable: true
      OutpostARN:
        is_immutable: true
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/volume/sdk_create_post_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/volume/sdk_read_many_post_set_output.go.tpl
      # EC2's defaults (type, IOPS, throughput, multi-attach, encryption)
      # are no drift (custom_delta.go, as ACK applicationautoscaling-
      # controller's ScalableTarget does).
      delta_pre_compare:
        code: customSetDefaults(a, b)
    # ModifyVolume changes the size, type, IOPS, throughput and
    # multi-attach; tags are synced as for the gateways.
    update_operation:
      custom_method_name: customUpdateVolume
    synced:
      when:
        - path: Status.State
          in:
            - available
            - in-use
ignore:
  field_paths:
    # Deprecated: IpAddress replaces it (EC2 API reference).
    - CreateCustomerGatewayInput.PublicIp
    - CreateCustomerGatewayInput.DryRun
    # Tags are spec.tags (TagSpecifications built from them on create).
    - CreateCustomerGatewayInput.TagSpecifications
    - CreateVpnGatewayInput.DryRun
    - CreateVpnGatewayInput.TagSpecifications
    - CreateVolumeInput.DryRun
    - CreateVolumeInput.ClientToken
    - CreateVolumeInput.TagSpecifications
    - CreateVolumeInput.Operator
    - CreateNetworkInterfacePermissionInput.DryRun
    - EnableVgwRoutePropagationInput.DryRun
    - DisableVgwRoutePropagationInput.DryRun
    - DescribeRouteTablesInput.DryRun
    # The attachments are the VolumeAttachment kind's to report; ignoring
    # them also keeps the generator from emitting a VolumeAttachment type
    # that would clash with that kind.
    - Volume.Attachments
    - CreateVolumeOutput.Attachments
    - CreateVpnConnectionInput.DryRun
    - CreateVpnConnectionInput.TagSpecifications
    # Holds the tunnels' pre-shared keys in clear: never kept in the object.
    - CreateVpnConnectionOutput.VpnConnection.CustomerGatewayConfiguration
  resource_names:
    - CapacityReservation
    - CapacityReservationBySplitting
    - CapacityReservationFleet
    - CarrierGateway
    - ClientVpnEndpoint
    - ClientVpnRoute
    - CoipCidr
    - CoipPool
    - DefaultSubnet
    - DefaultVpc
    - EgressOnlyInternetGateway
    - Fleet
    - FpgaImage
    - Image
    - InstanceConnectEndpoint
    - InstanceEventWindow
    - InstanceExportTask
    - InternetGateway
    - Ipam
    - IpamExternalResourceVerificationToken
    - IpamPool
    - IpamResourceDiscovery
    - IpamScope
    - KeyPair
    - LaunchTemplate
    - LaunchTemplateVersion
    - LocalGatewayRoute
    - LocalGatewayRouteTable
    - LocalGatewayRouteTableVirtualInterfaceGroupAssociation
    - LocalGatewayRouteTableVpcAssociation
    - ManagedPrefixList
    - NatGateway
    - NetworkAcl
    - NetworkAclEntry
    - NetworkInsightsAccessScope
    - NetworkInsightsPath
    - NetworkInterface
    - PlacementGroup
    - PublicIpv4Pool
    - ReplaceRootVolumeTask
    - ReservedInstancesListing
    - RestoreImageTask
    - Route
    - RouteTable
    - SecurityGroup
    - Snapshot
    - SpotDatafeedSubscription
    - StoreImageTask
    - Subnet
    - SubnetCidrReservation
    - TrafficMirrorFilter
    - TrafficMirrorFilterRule
    - TrafficMirrorSession
    - TrafficMirrorTarget
    - TransitGateway
    - TransitGatewayConnect
    - TransitGatewayConnectPeer
    - TransitGatewayMulticastDomain
    - TransitGatewayPeeringAttachment
    - TransitGatewayPolicyTable
    - TransitGatewayPrefixListReference
    - TransitGatewayRoute
    - TransitGatewayRouteTable
    - TransitGatewayRouteTableAnnouncement
    - TransitGatewayVpcAttachment
    - VerifiedAccessEndpoint
    - VerifiedAccessGroup
    - VerifiedAccessInstance
    - VerifiedAccessTrustProvider
    - Vpc
    - VpcBlockPublicAccessExclusion
    - VpcEndpoint
    - VpcEndpointConnectionNotification
    - VpcEndpointServiceConfiguration
    - VpcPeeringConnection
    - VpnConnectionRoute
