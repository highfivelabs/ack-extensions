# Generator configuration for ack-extensions's IAM kinds (iam.aws.hfl.dev).
#
# IAM's API has no Create/Delete pair for a role's managed-policy
# attachment (AttachRolePolicy/DetachRolePolicy), so the generator cannot
# produce RolePolicyAttachment; it is written by hand on ACK's runtime
# (services/iam/pkg/resource/role_policy_attachment), as upstream pull
# request #184 writes it. Every resource the generator can find is ignored:
# it generates only the service's scaffolding (the API group, the resource
# registry, the controller's main).
#
# LoginProfile (a user's console password) is generated from
# CreateLoginProfile, GetLoginProfile, UpdateLoginProfile and
# DeleteLoginProfile; the password comes from a Kubernetes Secret.
#
# AccessKey (a user's access key) is generated from CreateAccessKey,
# ListAccessKeys (read, matched on the key's ID) and DeleteAccessKey. The
# secret access key, which only the create returns, is never put in the
# object: it is ignored below, and a hook writes it into a Kubernetes Secret
# owned by the object (hooks.go). UpdateAccessKey is ignored: every field is
# immutable, and rotation is a new AccessKey.
resources:
  AccessKey:
    exceptions:
      errors:
        404:
          code: NoSuchEntity
    list_operation:
      match_fields:
        - AccessKeyId
    fields:
      UserName:
        is_required: true
        is_immutable: true
        references:
          resource: User
          path: Spec.Name
      SecretName:
        # The Secret the key is written to, in the object's namespace; the
        # object's name when unset.
        type: string
        is_immutable: true
      AccessKeyId:
        is_primary_key: true
    update_operation:
      # Every field is immutable: a changed userRef is refused here, with
      # how to rotate (hooks.go).
      custom_method_name: customUpdateAccessKey
    hooks:
      sdk_read_many_pre_build_request:
        template_path: hooks/access_key/sdk_read_many_pre_build_request.go.tpl
      sdk_create_pre_build_request:
        template_path: hooks/access_key/sdk_create_pre_build_request.go.tpl
      sdk_create_post_request:
        template_path: hooks/access_key/sdk_create_post_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/access_key/sdk_delete_post_request.go.tpl
    tags:
      ignore: true
  LoginProfile:
    exceptions:
      errors:
        404:
          code: NoSuchEntity
    fields:
      UserName:
        is_primary_key: true
        is_immutable: true
        is_required: true
      Password:
        is_secret: true
        is_required: true
    hooks:
      # IAM reports passwordResetRequired false when the spec leaves it
      # out; that default is no drift (custom_delta.go).
      delta_pre_compare:
        code: customSetDefaults(a, b)
    # A login profile has no tags.
    tags:
      ignore: true
ignore:
  # A shape with the name of a hand-written kind (services/iam/apis, written
  # here) would be generated as a second type of that name.
  shape_names:
    - SSHPublicKey
    # The SDK's User shape would clash with the alias of ACK's User kind
    # (apis/v1alpha1/ack_kinds.go); no field of ours uses it.
    - User
  operations:
    # Every AccessKey field is immutable (above); the key's Active/Inactive
    # status is not managed.
    - UpdateAccessKey
  field_paths:
    # Returned once, by the create; written to a Secret by a hook, never kept
    # in the object.
    - CreateAccessKeyOutput.AccessKey.SecretAccessKey
  resource_names:
    - AccountAlias
    - Group
    - InstanceProfile
    - OpenIDConnectProvider
    - Policy
    - PolicyVersion
    - Role
    - SAMLProvider
    - ServiceLinkedRole
    - ServiceSpecificCredential
    - User
    - VirtualMFADevice
