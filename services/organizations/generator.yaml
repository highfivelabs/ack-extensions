# Generator configuration for ack-extensions's AWS Organizations kinds
# (organizations.aws.hfl.dev), beside ACK's organizations-controller
# (v1.7.0), which has Account and OrganizationalUnit.
#
# Policy is generated from CreatePolicy, DescribePolicy, UpdatePolicy and
# DeletePolicy: service control policies and the other policy types.
# ACK's generator.yaml ignores Policy and Organization; community issue
# #2884 proposes Policy, PolicyAttachment and DelegatedAdministrator, with
# no pull request (docs/plan.md, section 6.25).
# Every response wraps the policy in a PolicySummary (id, ARN, name,
# description, type) beside its content, so the generator cannot read the
# identifier or the spec's name, description and type back; the hooks do
# (hooks.go). Tags are not in the response either: ListTagsForResource.
#
# PolicyAttachment is generated from AttachPolicy (create), DetachPolicy
# (delete) and ListTargetsForPolicy (read, matched on the target),
# mapped below as ACK maps its own Put-shaped kinds. It attaches one policy
# to one root, OU or account and leaves the target's other policies alone
# (CloudFormation's Policy.TargetIds is the exclusive form, not built).
# targetRef names ACK's OrganizationalUnit; the generator writes such a
# reference as a type of this package, so apis/v1alpha1/ack_kinds.go
# aliases ACK's type.
#
# DelegatedAdministrator is generated from RegisterDelegatedAdministrator
# (create), DeregisterDelegatedAdministrator (delete) and
# ListDelegatedAdministrators (read, filtered by the service principal and
# matched on the account), mapped below. accountRef names ACK's Account,
# through a type alias of ACK's type (apis/v1alpha1/ack_kinds.go).
#
# AccountPlacement is generated from MoveAccount (the create and the
# update) and ListParents (read, the account's one parent), mapped below:
# the OU (or root) an account is in, the sidecar community issue #2369
# asks for. MoveAccount's SourceParentId is the parent read last, set by a
# hook (hooks.go). There is no delete: an account always has a parent, so
# deleting the object leaves the account where it is.
#
# Organization is generated from CreateOrganization (create) and
# DescribeOrganization (read, which takes no input: it finds the account's
# organization). The create adopts an existing organization and makes one
# only when there is none; until an object has done so, its read finds
# nothing, as for the other account-wide singletons here.
# DeleteOrganization is ignored, so the controller has no code that calls
# it: deleting the object only stops managing the organization (docs/plan.md
# section 9, question 12). The enabled policy types and trusted service
# access are custom fields, applied by hand-written syncs (hooks.go) after
# the create and in the update (there is no UpdateOrganization).
operations:
  AttachPolicy:
    operation_type: Create
    resource_name: PolicyAttachment
  DetachPolicy:
    operation_type: Delete
    resource_name: PolicyAttachment
  ListTargetsForPolicy:
    operation_type: List
    resource_name: PolicyAttachment
  RegisterDelegatedAdministrator:
    operation_type: Create
    resource_name: DelegatedAdministrator
  DeregisterDelegatedAdministrator:
    operation_type: Delete
    resource_name: DelegatedAdministrator
  ListDelegatedAdministrators:
    operation_type: List
    resource_name: DelegatedAdministrator
  MoveAccount:
    operation_type:
      - Create
      - Update
    resource_name: AccountPlacement
  ListParents:
    operation_type: List
    resource_name: AccountPlacement
ignore:
  # The SDK's Account shape (no field of ours uses it) would clash with the
  # alias of ACK's Account kind (apis/v1alpha1/ack_kinds.go).
  shape_names:
    - Account
    # ListParents' and ListChildren's elements: no field of ours uses them.
    - Child
    - Parent
  operations:
    # Never called: an organization is not deleted from Kubernetes.
    - DeleteOrganization
  field_paths:
    # Deprecated in the API; the root's policy types are read instead.
    - CreateOrganizationOutput.Organization.AvailablePolicyTypes
    - DescribeOrganizationOutput.Organization.AvailablePolicyTypes
    # The parent the account is moved from: the one read last (hooks.go).
    - MoveAccountInput.SourceParentId
  resource_names:
    - Account
    - GovCloudAccount
    - OrganizationalUnit
resources:
  Policy:
    exceptions:
      errors:
        404:
          code: PolicyNotFoundException
      terminal_codes:
        - InvalidInputException
        - MalformedPolicyDocumentException
        - DuplicatePolicyException
    fields:
      ID:
        is_primary_key: true
        is_read_only: true
        from:
          operation: CreatePolicy
          path: Policy.PolicySummary.Id
      Type:
        # UpdatePolicy cannot change it.
        is_immutable: true
      Content:
        # Compared as JSON, not as text (customPreCompare).
        compare:
          is_ignored: true
    renames:
      operations:
        DescribePolicy:
          input_fields:
            PolicyId: ID
        UpdatePolicy:
          input_fields:
            PolicyId: ID
        DeletePolicy:
          input_fields:
            PolicyId: ID
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/policy/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/policy/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/policy/sdk_update_pre_build_request.go.tpl
  PolicyAttachment:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: PolicyNotFoundException
      terminal_codes:
        - InvalidInputException
        - PolicyTypeNotEnabledException
    list_operation:
      match_fields:
        - TargetId
    fields:
      PolicyID:
        is_primary_key: true
        is_immutable: true
        references:
          resource: Policy
          path: Status.ID
      TargetID:
        is_immutable: true
        references:
          resource: OrganizationalUnit
          path: Status.ID
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/policy_attachment/sdk_read_many_post_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/policy_attachment/sdk_delete_post_request.go.tpl
  DelegatedAdministrator:
    tags:
      ignore: true
    exceptions:
      terminal_codes:
        - InvalidInputException
        - AccountAlreadyRegisteredException
        - ConstraintViolationException
    renames:
      operations:
        ListDelegatedAdministrators:
          output_fields:
            Id: AccountId
    list_operation:
      match_fields:
        - AccountId
    fields:
      AccountID:
        is_primary_key: true
        is_immutable: true
        references:
          resource: Account
          path: Status.AccountID
      ServicePrincipal:
        is_immutable: true
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/delegated_administrator/sdk_read_many_post_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/delegated_administrator/sdk_delete_post_request.go.tpl
  AccountPlacement:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: ChildNotFoundException
      terminal_codes:
        - InvalidInputException
        - ConstraintViolationException
    renames:
      operations:
        MoveAccount:
          input_fields:
            DestinationParentId: ParentId
        ListParents:
          input_fields:
            ChildId: AccountId
          output_fields:
            Id: ParentId
    fields:
      AccountID:
        is_primary_key: true
        is_immutable: true
        references:
          resource: Account
          path: Status.AccountID
      ParentID:
        references:
          resource: OrganizationalUnit
          path: Status.ID
    hooks:
      sdk_read_many_pre_build_request:
        template_path: hooks/account_placement/sdk_read_many_pre_build_request.go.tpl
      sdk_create_post_build_request:
        template_path: hooks/account_placement/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/account_placement/sdk_create_post_set_output.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/account_placement/sdk_update_post_build_request.go.tpl
  Organization:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: AWSOrganizationsNotInUseException
      terminal_codes:
        - InvalidInputException
        - ConstraintViolationException
        - AccessDeniedForDependencyException
        # A policy type the feature set does not allow (consolidated billing).
        - PolicyTypeNotAvailableForOrganizationException
    update_operation:
      # There is no UpdateOrganization: the feature set is immutable and the
      # custom fields have their own calls (hooks.go).
      custom_method_name: customUpdateOrganization
    fields:
      ID:
        # The organization's ID (o-...), from the response.
        is_primary_key: true
        is_read_only: true
      FeatureSet:
        is_immutable: true
        late_initialize: {}
      EnabledPolicyTypes:
        # EnablePolicyType/DisablePolicyType on the root, read with ListRoots.
        custom_field:
          list_of: PolicyType
        compare:
          is_ignored: true
      AWSServiceAccessPrincipals:
        # EnableAWSServiceAccess/DisableAWSServiceAccess, read with
        # ListAWSServiceAccessForOrganization.
        custom_field:
          list_of: ServicePrincipal
        compare:
          is_ignored: true
      RootID:
        is_read_only: true
        type: string
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_pre_build_request:
        template_path: hooks/organization/sdk_create_pre_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/organization/sdk_create_post_set_output.go.tpl
      sdk_read_one_pre_build_request:
        template_path: hooks/organization/sdk_read_one_pre_build_request.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/organization/sdk_read_one_post_set_output.go.tpl
