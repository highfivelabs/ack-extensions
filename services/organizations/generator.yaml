# Generator configuration for ack-extensions's AWS Organizations kinds
# (organizations.aws.hfl.dev), beside ACK's organizations-controller
# (v1.7.0), which has Account and OrganizationalUnit.
#
# Policy is generated from CreatePolicy, DescribePolicy, UpdatePolicy and
# DeletePolicy: service control policies and the other policy types.
# ACK's generator.yaml ignores Policy and Organization; community issue
# #2884 proposes Policy, PolicyAttachment and DelegatedAdministrator, with
# no pull request (docs/plan.md, section 6.25).
# Every response wraps the policy in a PolicySummary (id, ARN, name,
# description, type) beside its content, so the generator cannot read the
# identifier or the spec's name, description and type back; the hooks do
# (hooks.go). Tags are not in the response either: ListTagsForResource.
#
# PolicyAttachment is generated from AttachPolicy (create), DetachPolicy
# (delete) and ListTargetsForPolicy (read, matched on the target),
# mapped below as ACK maps its own Put-shaped kinds. It attaches one policy
# to one root, OU or account and leaves the target's other policies alone
# (CloudFormation's Policy.TargetIds is the exclusive form, not built).
# targetRef names ACK's OrganizationalUnit; the generator writes such a
# reference as a type of this package, so apis/v1alpha1/ack_kinds.go
# aliases ACK's type.
#
# DelegatedAdministrator is generated from RegisterDelegatedAdministrator
# (create), DeregisterDelegatedAdministrator (delete) and
# ListDelegatedAdministrators (read, filtered by the service principal and
# matched on the account), mapped below. accountRef names ACK's Account,
# through a type alias of ACK's type (apis/v1alpha1/ack_kinds.go).
operations:
  AttachPolicy:
    operation_type: Create
    resource_name: PolicyAttachment
  DetachPolicy:
    operation_type: Delete
    resource_name: PolicyAttachment
  ListTargetsForPolicy:
    operation_type: List
    resource_name: PolicyAttachment
  RegisterDelegatedAdministrator:
    operation_type: Create
    resource_name: DelegatedAdministrator
  DeregisterDelegatedAdministrator:
    operation_type: Delete
    resource_name: DelegatedAdministrator
  ListDelegatedAdministrators:
    operation_type: List
    resource_name: DelegatedAdministrator
ignore:
  # The SDK's Account shape (no field of ours uses it) would clash with the
  # alias of ACK's Account kind (apis/v1alpha1/ack_kinds.go).
  shape_names:
    - Account
  resource_names:
    - Account
    - GovCloudAccount
    - Organization
    - OrganizationalUnit
resources:
  Policy:
    exceptions:
      errors:
        404:
          code: PolicyNotFoundException
      terminal_codes:
        - InvalidInputException
        - MalformedPolicyDocumentException
        - DuplicatePolicyException
    fields:
      ID:
        is_primary_key: true
        is_read_only: true
        from:
          operation: CreatePolicy
          path: Policy.PolicySummary.Id
      Type:
        # UpdatePolicy cannot change it.
        is_immutable: true
      Content:
        # Compared as JSON, not as text (customPreCompare).
        compare:
          is_ignored: true
    renames:
      operations:
        DescribePolicy:
          input_fields:
            PolicyId: ID
        UpdatePolicy:
          input_fields:
            PolicyId: ID
        DeletePolicy:
          input_fields:
            PolicyId: ID
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/policy/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/policy/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/policy/sdk_update_pre_build_request.go.tpl
  PolicyAttachment:
    tags:
      ignore: true
    exceptions:
      errors:
        404:
          code: PolicyNotFoundException
      terminal_codes:
        - InvalidInputException
        - PolicyTypeNotEnabledException
    list_operation:
      match_fields:
        - TargetId
    fields:
      PolicyID:
        is_primary_key: true
        is_immutable: true
        references:
          resource: Policy
          path: Status.ID
      TargetID:
        is_immutable: true
        references:
          resource: OrganizationalUnit
          path: Status.ID
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/policy_attachment/sdk_read_many_post_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/policy_attachment/sdk_delete_post_request.go.tpl
  DelegatedAdministrator:
    tags:
      ignore: true
    exceptions:
      terminal_codes:
        - InvalidInputException
        - AccountAlreadyRegisteredException
        - ConstraintViolationException
    renames:
      operations:
        ListDelegatedAdministrators:
          output_fields:
            Id: AccountId
    list_operation:
      match_fields:
        - AccountId
    fields:
      AccountID:
        is_primary_key: true
        is_immutable: true
        references:
          resource: Account
          path: Status.AccountID
      ServicePrincipal:
        is_immutable: true
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/delegated_administrator/sdk_read_many_post_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/delegated_administrator/sdk_delete_post_request.go.tpl
