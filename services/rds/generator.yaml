# Generator configuration for ack-extensions's RDS kinds (rds.aws.hfl.dev).
#
# Only the kinds ACK does not ship are generated here; every resource ACK's
# rds-controller already has is ignored so it is never generated twice.
#
# DBProxyTarget is written by hand (services/rds/pkg/resource/db_proxy_target):
# RegisterDBProxyTargets is not a Create the generator recognises.
#
# OptionGroup is copied from aws-controllers-k8s/rds-controller pull
# request #257 (head 32c3cb2394518c5e976eba841e070cc6053484b1, generator.yaml
# lines 720-796), unchanged apart from the template paths, which point at
# this directory. See UPSTREAM.md.
ignore:
  resource_names:
    - BlueGreenDeployment
    - CustomAvailabilityZone
    - CustomDBEngineVersion
    - DBCluster
    - DBClusterEndpoint
    - DBClusterParameterGroup
    - DBClusterSnapshot
    - DBInstance
    - DBInstanceReadReplica
    - DBParameterGroup
    - DBProxy
    - DBProxyEndpoint
    - DBSecurityGroup
    - DBShardGroup
    - DBSnapshot
    - DBSubnetGroup
    - EventSubscription
    - GlobalCluster
    - Integration
    - TenantDatabase
  # DBProxyTarget is the name of our hand-written kind
  # (apis/v1alpha1/db_proxy_target.go); the SDK shape of the same name is
  # never used by a generated kind, so it is not generated.
  shape_names:
    - DBProxyTarget
resources:
  OptionGroup:
    renames:
      operations:
        CreateOptionGroup:
          input_fields:
            OptionGroupDescription: Description
            OptionGroupName: Name
          output_fields:
            OptionGroupDescription: Description
            OptionGroupName: Name
            # The read shape's observed options bind to Status.ObservedOptions;
            # the desired options live in Spec.Options (from OptionsToInclude).
            Options: ObservedOptions
        DeleteOptionGroup:
          input_fields:
            OptionGroupName: Name
        DescribeOptionGroups:
          input_fields:
            OptionGroupName: Name
          output_fields:
            OptionGroupDescription: Description
            OptionGroupName: Name
            Options: ObservedOptions
        ModifyOptionGroup:
          input_fields:
            OptionGroupName: Name
          output_fields:
            OptionGroupDescription: Description
            OptionGroupName: Name
            Options: ObservedOptions
    update_operation:
      # CreateOptionGroup cannot set Options; they are configured via
      # ModifyOptionGroup's OptionsToInclude/OptionsToRemove. We compute the
      # add/remove sets ourselves in customUpdate.
      custom_method_name: customUpdate
    exceptions:
      terminal_codes:
        - InvalidParameterValue
        - InvalidParameterCombination
    fields:
      Name:
        is_primary_key: true
      # These three fields are only accepted by CreateOptionGroup; the RDS
      # ModifyOptionGroup API has no way to change them, so a change must be
      # rejected as terminal rather than retried forever.
      Description:
        is_immutable: true
      EngineName:
        is_immutable: true
      MajorEngineVersion:
        is_immutable: true
      # The desired set of options for the group, sourced from
      # ModifyOptionGroup's OptionsToInclude shape. We reconcile these against
      # the observed options via a custom comparison + update.
      Options:
        from:
          operation: ModifyOptionGroup
          path: OptionsToInclude
        compare:
          is_ignored: true
      # The observed options as returned by DescribeOptionGroups. This is the
      # richer read shape (includes server-applied defaults and statuses).
      ObservedOptions:
        from:
          operation: DescribeOptionGroups
          path: OptionGroupsList.Options
        is_read_only: true
      Tags:
        compare:
          is_ignored: true
    hooks:
      # Not in upstream pull request #257: DescribeOptionGroups refuses
      # OptionGroupName together with EngineName or MajorEngineVersion, and
      # the generated request sets all three (read.go).
      sdk_read_many_post_build_request:
        code: describeByNameOnly(input)
      sdk_read_many_post_set_output:
        template_path: hooks/option_group/sdk_read_many_post_set_output.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/option_group/sdk_create_post_set_output.go.tpl
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
