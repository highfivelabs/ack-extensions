# Generator configuration for ack-extensions's EventBridge Scheduler kinds
# (scheduler.aws.hfl.dev).
#
# ACK has no Scheduler controller (community issue #2784). The manager
# runs beside ACK's EventBridge controller, with its identity (open
# question 8, answered: pkg/operator, Beside).
#
# Schedule is generated from CreateSchedule, GetSchedule, UpdateSchedule
# and DeleteSchedule; groupRef names a ScheduleGroup. Scheduler fills in
# defaults (the time zone, the state, the target's retry policy, the
# action after completion) that are no drift (custom_delta.go).
#
# ScheduleGroup is generated from CreateScheduleGroup, GetScheduleGroup and
# DeleteScheduleGroup. A group has no update; its tags are synced with
# TagResource and UntagResource (customUpdate in hooks.go, copied from
# eventbridge-controller's EventBus).
resources:
  Schedule:
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
      GroupName:
        is_immutable: true
        references:
          resource: ScheduleGroup
          path: Spec.Name
    hooks:
      delta_pre_compare:
        code: customSetDefaults(a, b)
    tags:
      ignore: true
  ScheduleGroup:
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
      Tags:
        compare:
          is_ignored: true
    update_operation:
      custom_method_name: customUpdate
    hooks:
      delta_pre_compare:
        code: compareTags(delta, a, b)
      sdk_read_one_post_set_output:
        template_path: hooks/schedule_group/sdk_read_one_post_set_output.go.tpl
ignore:
  field_paths:
    - CreateScheduleGroupInput.ClientToken
    - CreateScheduleInput.ClientToken
    - UpdateScheduleInput.ClientToken
