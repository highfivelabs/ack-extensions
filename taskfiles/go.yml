#
# Tasks any High Five Labs Go repository can include: nothing here names
# this repository. Include it with the variables it needs:
#
#   includes:
#     go:
#       taskfile: ./taskfiles/go.yml
#       vars: {BIN: "{{.ROOT_DIR}}/bin"}
#
# taskfiles/README.md says how the file is shared between repositories.
version: '3'

tasks:
  # go install a tool into BIN, once (the binary's presence is the check, as
  # a make file target was). Vars: BIN, NAME (the binary), PKG (path@version).
  install-tool:
    internal: true
    status:
      - test -x "{{.BIN}}/{{.NAME}}"
    cmds:
      - GOBIN="{{.BIN}}" go install {{.PKG}}

  # Fail if any Go file under DIRS (space-separated) needs gofmt.
  fmt-check:
    cmds:
      - |
        out="$(gofmt -l {{.DIRS}})"
        if [ -n "$out" ]; then echo "$out"; echo "gofmt needed"; exit 1; fi

  # Fail if the working tree differs from the index or has untracked files
  # under PATHS (space-separated): generated output must be committed.
  # Vars: PATHS, WHAT (what the paths hold, for the message).
  committed:
    cmds:
      - |
        git diff --exit-code -- {{.PATHS}} || { echo "{{.WHAT}} are stale; commit the output of the generator"; exit 1; }
        untracked="$(git ls-files --others --exclude-standard -- {{.PATHS}})"
        if [ -n "$untracked" ]; then echo "$untracked"; echo "files under {{.PATHS}} are not committed"; exit 1; fi

  # go test with envtest's assets found, or fail rather than pass with the
  # envtest tests skipped. The download is retried: GitHub's release
  # downloads sometimes answer 5xx. Vars: BIN (holding setup-envtest),
  # ENVTEST_K8S_VERSION, PKGS (default ./...), TIMEOUT (default 30m: go test's
  # own 10m stops a package whose tests run one after another, as tests/e2e's
  # now do, a few minutes short of finishing).
  test-envtest:
    cmds:
      - |
        assets=""
        for i in 1 2 3 4 5; do
          assets="$("{{.BIN}}/setup-envtest" use {{.ENVTEST_K8S_VERSION}} --bin-dir "{{.BIN}}/envtest" -p path)" && [ -n "$assets" ] && break
          assets=""; echo "setup-envtest failed (attempt $i); retrying"; sleep $((i * 10))
        done
        [ -n "$assets" ] || { echo "no envtest assets for {{.ENVTEST_K8S_VERSION}}: refusing to run with the end-to-end tests skipped"; exit 1; }
        echo "KUBEBUILDER_ASSETS=$assets go test {{.PKGS | default "./..."}} -count=1 -timeout {{.TIMEOUT | default "30m"}}"
        KUBEBUILDER_ASSETS="$assets" go test {{.PKGS | default "./..."}} -count=1 -timeout {{.TIMEOUT | default "30m"}}
