# What a live run of the ACK-kind tests (task test-live SUITE=ack,
# docs/live-runs.md) needs beyond what hack/cloudcontrol-gen reads from the
# code (each ACK-generated kind's calls, pkg/ackiam, and each SDK operation
# the tests call): it goes into the live-test role's policies,
# cloudcontrol/config/live/role-policies.yaml (the catalog instance).
actions:
  # ACK's kms-controller, run beside ours by TestKeyExtension (its Key).
  - kms:CreateKey
  - kms:DescribeKey
  - kms:ScheduleKeyDeletion
  - kms:ListResourceTags
  - kms:TagResource
  - kms:UntagResource
  - kms:GetKeyPolicy
  - kms:PutKeyPolicy
  - kms:GetKeyRotationStatus
  - kms:EnableKeyRotation
  - kms:DisableKeyRotation
  - kms:EnableKey
  - kms:DisableKey
  - kms:UpdateKeyDescription
  - kms:ListAliases
  - kms:ListGrants
  # ACK's s3-controller, run beside ours by TestBucketExtension (its Bucket).
  - s3:CreateBucket
  - s3:DeleteBucket
  - s3:ListBucket
  - s3:ListAllMyBuckets
  - s3:GetBucket*
  - s3:PutBucket*
  - s3:DeleteBucket*
  - s3:Get*Configuration
  - s3:Put*Configuration
  - s3:PutObject
  - s3:GetObject
  - s3:DeleteObject
  - s3:DeleteObjectVersion
  # Fixtures: roles handed to the services the tests set up.
  - iam:PassRole
  - ec2:DescribeAvailabilityZones
  - ec2:DescribeImages
  # CreateAutoScalingGroup with a launch template reads its versions as
  # the caller (live run ackx-11160302-80c8: AccessDenied).
  - ec2:DescribeLaunchTemplateVersions
  - ssm:GetParameter
  - ssm:GetParameters
  # The sweeper's ACK pass (hack/live/sweep): what carries the run tag, and
  # the IAM things the tests make.
  - tag:GetResources
  - iam:ListUsers
  - iam:ListRoles
  - iam:ListGroups
  - iam:ListPolicies
  - iam:ListVirtualMFADevices
  - iam:ListAccountAliases
  - iam:GetAccountPasswordPolicy
  - iam:ListUserTags
  - iam:ListRoleTags
  - kms:ListKeys
  - ec2:DescribeVolumes
  - ec2:DetachVolume
  - ec2:DeleteVolume
  - ec2:DescribeVpnConnections
  - ec2:DeleteVpnConnection
  - ec2:DescribeVpnGateways
  - ec2:DetachVpnGateway
  - ec2:DeleteVpnGateway
  - ec2:DescribeCustomerGateways
  - ec2:DeleteCustomerGateway
